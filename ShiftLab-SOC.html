  let rows = events.map(Q.splView);
  const firstToks = Q.splTokenize(first || '*');
  rows = rows.filter(Q.parseBool(firstToks, Q.splTermMatcher)).sort((a, b) => b._time - a._time);
  let stats = false; let columns = null;
  for (const seg of segs.slice(1)) {
    if (!seg) throw new Error('Search command is empty after a pipe.');
    const m = seg.match(/^(\w+)\s*([\s\S]*)$/);
    const cmd = m[1].toLowerCase(); const arg = (m[2] || '').trim();
    switch (cmd) {
      case 'search': rows = rows.filter(Q.parseBool(Q.splTokenize(arg), Q.splTermMatcher)); break;
      case 'where': { const fn = Q.parseExpr(arg); rows = rows.filter(r => { try { return !!fn(r); } catch (e) { return false; } }); break; }
      case 'eval': {
        const assigns = []; let depth = 0, cur = '';
        for (const ch of arg) { if (ch === '(') depth++; if (ch === ')') depth--; if (ch === ',' && depth === 0) { assigns.push(cur); cur = ''; } else cur += ch; }
        if (cur.trim()) assigns.push(cur);
        for (const a of assigns) {
          const mm = a.match(/^\s*([\w.]+)\s*=\s*([\s\S]+)$/);
          if (!mm) throw new Error(`Error in 'eval' command: The expression '${a.trim()}' is malformed.`);
          const fn = Q.parseExpr(mm[2]);
          rows = rows.map(r => { const o = Object.assign({}, r); o[mm[1]] = fn(r); return o; });
        }
        break;
      }
      case 'stats': case 'eventstats': {
        const bm = arg.match(/^([\s\S]*?)(?:\s+by\s+([\s\S]+))?$/i);
        const aggs = Q.parseAggs(bm[1]);
        if (!aggs.length) throw new Error("Error in 'stats' command: You must specify at least one aggregation.");
        const by = bm[2] ? bm[2].split(/[\s,]+/).filter(Boolean) : [];
        if (cmd === 'eventstats') {
          const agg = Q.aggregate(rows, aggs, by);
          const idx = new Map(agg.map(a => [by.map(f => a[f]).join('\u0001'), a]));
          rows = rows.map(r => Object.assign({}, r, idx.get(by.map(f => r[f] ?? '').join('\u0001')) || {}));
        } else {
          rows = Q.aggregate(rows, aggs, by); stats = true; columns = [...by, ...aggs.map(a => a.as)];
        }
        break;
      }
      case 'top': case 'rare': {
        const lm = arg.match(/limit=(\d+)/i);
        const limit = lm ? Number(lm[1]) : 10;
        const rest = arg.replace(/limit=\d+/i, '').replace(/(showperc|countfield|percentfield)=\S+/gi, '').trim();
        const bm = rest.match(/^([\s\S]*?)(?:\s+by\s+([\s\S]+))?$/i);
        const fields = bm[1].split(/[\s,]+/).filter(Boolean);
        if (!fields.length) throw new Error(`Error in '${cmd}' command: You must specify a field.`);
        const by = bm[2] ? bm[2].split(/[\s,]+/).filter(Boolean) : [];
        const agg = Q.aggregate(rows, [{ fn: 'count', field: null, as: 'count' }], [...by, ...fields]);
        const total = rows.filter(r => fields.every(f => r[f] !== undefined && r[f] !== '')).length || 1;
        agg.forEach(a => a.percent = +(a.count / total * 100).toFixed(6));
        agg.sort((a, b) => cmd === 'top' ? b.count - a.count : a.count - b.count);
        rows = agg.slice(0, limit); stats = true; columns = [...by, ...fields, 'count', 'percent'];
        break;
      }
      case 'table': {
        const fs = arg.split(/[\s,]+/).filter(Boolean);
        rows = rows.map(r => { const o = {}; for (const f of fs) { if (f.includes('*')) { const re = Q.wildRe(f); for (const k of Object.keys(r)) if (re.test(k) && !k.startsWith('_')) o[k] = r[k]; } else o[f] = r[f]; } return o; });
        stats = true; columns = fs.some(f => f.includes('*')) ? U.uniq(rows.flatMap(r => Object.keys(r))) : fs;
        break;
      }
      case 'fields': {
        const minus = arg.startsWith('-');
        const fs = arg.replace(/^[-+]/, '').split(/[\s,]+/).filter(Boolean);
        rows = rows.map(r => { const o = {}; for (const [k, v] of Object.entries(r)) { if (k.startsWith('_') || (minus ? !fs.includes(k) : fs.includes(k))) o[k] = v; } return o; });
        if (stats && columns) columns = minus ? columns.filter(c => !fs.includes(c)) : columns.filter(c => fs.includes(c));
        break;
      }
      case 'rename': {
        const pairs = arg.split(/\s*,\s*/).map(p => p.match(/^\s*(\S+)\s+as\s+(\S+)\s*$/i)).filter(Boolean);
        if (!pairs.length) throw new Error("Error in 'rename' command: Usage: rename <field> AS <newname>");
        rows = rows.map(r => { const o = Object.assign({}, r); for (const [, a, b] of pairs) { if (a in o) { o[b.replace(/"/g, '')] = o[a]; delete o[a]; } } return o; });
        if (columns) columns = columns.map(c => { const pr = pairs.find(p => p[1] === c); return pr ? pr[2].replace(/"/g, '') : c; });
        break;
      }
      case 'sort': {
        let a2 = arg; let limit = null;
        const lm = a2.match(/^(\d+)\s+/); if (lm) { limit = Number(lm[1]); a2 = a2.slice(lm[0].length); }
        a2 = a2.replace(/^(-|\+)\s+/, '$1');
        const keys = a2.split(/\s*,\s*|\s+/).filter(Boolean).map(k => {
          let desc = false;
          if (k.startsWith('-')) { desc = true; k = k.slice(1); } else if (k.startsWith('+')) k = k.slice(1);
          const nm = k.match(/^(?:num|str)\((.+)\)$/); if (nm) k = nm[1];
          return { k, desc };
        }).filter(x => x.k && !['desc', 'asc', 'd'].includes(x.k.toLowerCase()));
        if (/\bdesc$/i.test(a2) && keys.length) keys[keys.length - 1].desc = true;
        rows = rows.slice().sort((x, y) => { for (const { k, desc } of keys) { const c = Q.cmp(x[k], y[k]); if (c) return desc ? -c : c; } return 0; });
        if (limit) rows = rows.slice(0, limit);
        break;
      }
      case 'head': rows = rows.slice(0, Number(arg.match(/\d+/)?.[0] || 10)); break;
      case 'tail': rows = rows.slice(-Number(arg.match(/\d+/)?.[0] || 10)).reverse(); break;
      case 'reverse': rows = rows.slice().reverse(); break;
      case 'dedup': {
        const fs = arg.split(/[\s,]+/).filter(f => f && !f.includes('='));
        if (!fs.length) throw new Error("Error in 'dedup' command: You must specify at least one field.");
        const seen = new Set();
        rows = rows.filter(r => { const k = fs.map(f => r[f]).join('\u0001'); if (seen.has(k)) return false; seen.add(k); return true; });
        break;
      }
      case 'timechart': {
        const spm = arg.match(/span=(\S+)/i);
        const span = spm ? Q.parseSpan(spm[1]) : (range <= 3600e3 ? 60e3 : range <= 4 * 3600e3 ? 300e3 : range <= 86400e3 ? 1800e3 : 3 * 3600e3);
        if (!span) throw new Error("Error in 'timechart' command: Invalid span.");
        const rest = arg.replace(/span=\S+/i, '').trim();
        const bm = rest.match(/^([\s\S]*?)(?:\s+by\s+(\S+))?$/i);
        const aggs = Q.parseAggs(bm[1] || 'count');
        const by = bm[2];
        const buckets = new Map();
        for (const r of rows) {
          const b = Math.floor(r._time / span) * span;
          if (!buckets.has(b)) buckets.set(b, []);
          buckets.get(b).push(r);
        }
        let series = null;
        if (by) {
          const cnt = U.groupCount(rows, r => r[by] ?? 'NULL');
          series = Array.from(cnt.entries()).sort((a, b) => b[1] - a[1]).slice(0, 10).map(x => String(x[0]));
        }
        const keys = Array.from(buckets.keys()).sort((a, b) => a - b);
        const out = [];
        if (keys.length) {
          for (let b = keys[0]; b <= keys[keys.length - 1]; b += span) {
            const items = buckets.get(b) || [];
            const o = { _time: b };
            if (by) { for (const s of series) o[s] = items.filter(r => String(r[by] ?? 'NULL') === s).length; }
            else for (const a of aggs) o[a.as] = Q.STATS_FN[a.fn](a.field ? items.map(x => x[a.field]) : null, items) ?? 0;
            out.push(o);
          }
        }
        rows = out; stats = true; columns = ['_time', ...(by ? series : aggs.map(a => a.as))];
        break;
      }
      case 'bin': case 'bucket': {
        const spm = arg.match(/span=(\S+)/i); const f = arg.replace(/span=\S+/i, '').trim() || '_time';
        const span = spm ? Q.parseSpan(spm[1]) : 3600e3;
        rows = rows.map(r => Object.assign({}, r, { [f]: Math.floor(r[f] / span) * span }));
        break;
      }
      case 'iplocation': rows = rows.map(r => { const ip = r[arg.trim()]; return Object.assign({}, r, { Country: U.isInternal(ip) ? '' : (r.src_country || 'Unknown') }); }); break;
      default:
        throw new Error(`Unknown search command '${cmd}'.`);
    }
  }
  if (stats && !columns) columns = U.uniq(rows.flatMap(r => Object.keys(r))).filter(k => !k.startsWith('_') || k === '_time');
  return { rows, stats, columns };
};


'use strict';
/* ==========================================================================
   Shift state, clock, actions, autosave, scoring, export
   ========================================================================== */

const SAVE_KEY = 'shiftlab.v1.active';
const S = { cfg: null, D: null };      // global shift state
const BUS = { subs: {}, on(e, f) { (this.subs[e] = this.subs[e] || []).push(f); }, emit(e, d) { (this.subs[e] || []).forEach(f => { try { f(d); } catch (err) { console.error(err); } }); } };

const ENG = {};

ENG.SLA_BASE = { critical: 10, high: 20, medium: 45 };
ENG.slaMinutes = function (sev) {
  const base = ENG.SLA_BASE[sev];
  if (!base) return null;
  const f = Math.min(2, Math.max(0.5, S.cfg.lenMin / 45));
  return Math.max(3, Math.round(base * f));
};

ENG.newShift = function (cfg) {
  const scen = cfg.scenario;
  S.cfg = cfg;
  S.D = GEN.build(scen, cfg.seed, cfg.lenMin);
  S.clock = { activeMs: 0, paused: false, pauses: [], realStart: Date.now() };
  S.alerts = {}; S.cases = []; S.emails = {}; S.chat = {}; S.chatLog = []; S.questions = {};
  S.log = []; S.queries = []; S.lookups = []; S.ended = false; S.handover = null; S.score = null; S.caseSeq = 1041;
  S.notesPad = '';
  for (const a of S.D.alerts) S.alerts[a.id] = { status: 'new', disp: null, caseId: null, owner: null, urgency: null, comments: [], firstTouch: null, closedAt: null, bulk: 0, breachNotified: false };
  for (const e of S.D.emails) S.emails[e.id] = { status: 'new', verdict: null, openedAt: null, closedAt: null };
  for (const c of S.D.chat) S.chat[c.id] = { delivered: false, reply: null, readAt: null };
  if (S.D.case0) ENG.createCaseFromSeed(S.D.case0);
  ENG.logAct('shift_start', { scenario: scen.name, tier: scen.tier, mode: cfg.mode, lenMin: cfg.lenMin, seed: cfg.seed });
  ENG.save();
};

ENG.restore = function (saved) {
  S.cfg = saved.cfg;
  S.D = GEN.build(saved.cfg.scenario, saved.cfg.seed, saved.cfg.lenMin);
  Object.assign(S, saved.state);
  S.clock.paused = true; // always come back paused
  S.clock.pauses.push({ at: S.D.start + S.clock.activeMs, real: Date.now(), dur: 0, reason: 'resumed after closing the page' });
  ENG.logAct('shift_resumed', {});
};

ENG.save = function () {
  if (!S.cfg) return;
  const state = { clock: S.clock, alerts: S.alerts, cases: S.cases, emails: S.emails, chat: S.chat, chatLog: S.chatLog, questions: S.questions, log: S.log, queries: S.queries, lookups: S.lookups, ended: S.ended, handover: S.handover, caseSeq: S.caseSeq, notesPad: S.notesPad };
  U.store.set(SAVE_KEY, { v: 1, savedAt: Date.now(), cfg: S.cfg, state });
};
ENG.saveSoon = U.debounce(() => ENG.save(), 800);
ENG.clearSave = () => U.store.del(SAVE_KEY);

// ------------------------------------------------------------------ clock
ENG.now = () => S.D.start + S.clock.activeMs;
ENG.elapsedMs = () => S.clock.activeMs;
ENG.remainingMs = () => Math.max(0, S.cfg.lenMin * 60000 - S.clock.activeMs);
ENG.tick = function (realDelta) {
  if (!S.cfg || S.ended || S.clock.paused) return;
  S.clock.activeMs += realDelta;
  if (S.clock.activeMs >= S.cfg.lenMin * 60000) {
    S.clock.activeMs = S.cfg.lenMin * 60000;
    ENG.lockShift('time');
  }
};
ENG.pause = function (reason) {
  if (S.clock.paused || S.ended) return;
  S.clock.paused = true;
  S.clock.pauses.push({ at: ENG.now(), real: Date.now(), dur: 0, reason: reason || 'analyst paused' });
  ENG.logAct('pause', {});
  ENG.save();
  BUS.emit('pause', true);
};
ENG.resume = function () {
  if (!S.clock.paused) return;
  S.clock.paused = false;
  const p = S.clock.pauses[S.clock.pauses.length - 1];
  if (p) p.dur = Date.now() - p.real;
  ENG.logAct('resume', { pausedSec: p ? Math.round(p.dur / 1000) : 0 });
  ENG.save();
  BUS.emit('pause', false);
};
ENG.lockShift = function (why) {
  if (S.locked) return;
  S.locked = true;
  S.clock.paused = true;
  ENG.logAct('queue_locked', { reason: why });
  ENG.save();
  BUS.emit('locked', why);
};

// ------------------------------------------------------------------ visibility
ENG.visibleEvents = function (rangeMs) {
  const now = ENG.now();
  const from = rangeMs ? now - rangeMs : -Infinity;
  const ev = S.D.events;
  // events are sorted ascending
  let hi = ev.length;
  { let lo = 0, h = ev.length; while (lo < h) { const m = (lo + h) >> 1; if (ev[m]._ts <= now) lo = m + 1; else h = m; } hi = lo; }
  let lo2 = 0;
  if (from > -Infinity) { let lo = 0, h = hi; while (lo < h) { const m = (lo + h) >> 1; if (ev[m]._ts < from) lo = m + 1; else h = m; } lo2 = lo; }
  return ev.slice(lo2, hi);
};
ENG.arrivedAlerts = function () { const now = ENG.now(); return S.D.alerts.filter(a => a.ts <= now); };
ENG.alertArrival = a => Math.max(a.ts, S.D.start);
ENG.arrivedEmails = function () { const now = ENG.now(); return S.D.emails.filter(e => e.reportTs <= now); };

ENG.slaState = function (a) {
  const mins = ENG.slaMinutes(a.sev);
  if (!mins) return null;
  const st = S.alerts[a.id];
  const deadline = ENG.alertArrival(a) + mins * 60000;
  if (st.firstTouch) return { mins, deadline, met: st.firstTouch <= deadline, done: true, left: deadline - st.firstTouch };
  const left = deadline - ENG.now();
  return { mins, deadline, met: left >= 0, done: false, left };
};

// periodic: deliver chat, SLA breach notices
ENG.housekeeping = function () {
  if (!S.cfg || S.ended) return;
  const now = ENG.now();
  for (const c of S.D.chat) {
    const st = S.chat[c.id];
    if (!st.delivered && c.ts <= now) {
      st.delivered = true; st.deliveredAt = now;
      S.chatLog.push({ id: c.id, from: c.from, role: c.role || 'lead', text: c.text, at: now, mine: false });
      ENG.logAct('chat_received', { id: c.id, from: c.from });
      BUS.emit('chat', c);
      ENG.saveSoon();
    }
  }
  for (const a of S.D.alerts) {
    if (a.ts > now) break;
    const st = S.alerts[a.id];
    if (st.firstTouch || st.breachNotified) continue;
    const sla = ENG.slaState(a);
    if (sla && !sla.met) {
      st.breachNotified = true;
      ENG.logAct('sla_breach', { alert: a.id, sev: a.sev, rule: a.rule });
      BUS.emit('sla', a);
    }
  }
};

// ------------------------------------------------------------------ logging
ENG.logAct = function (type, detail) {
  if (!S.log) return;
  S.log.push({ seq: S.log.length + 1, sim: S.D ? U.iso(ENG.now()) : null, elapsedSec: S.clock ? Math.round(S.clock.activeMs / 1000) : 0, real: new Date().toISOString(), type, ...detail });
};
ENG.logQuery = function (page, q, rangeLabel, count, err) {
  S.queries.push({ sim: U.iso(ENG.now()), elapsedSec: Math.round(S.clock.activeMs / 1000), mode: S.cfg.mode, page, query: q, range: rangeLabel, results: count, error: err || undefined });
  ENG.saveSoon();
};
ENG.logLookup = function (kind, value, found, context) {
  S.lookups.push({ sim: U.iso(ENG.now()), elapsedSec: Math.round(S.clock.activeMs / 1000), kind, value, found, context: context || undefined });
  ENG.saveSoon();
};

// ------------------------------------------------------------------ alert actions
ENG.touch = function (st) { if (!st.firstTouch) st.firstTouch = ENG.now(); };
ENG.disposition = function (ids, disp, comment, opts = {}) {
  const bulk = ids.length > 1 ? ids.length : 0;
  for (const id of ids) {
    const st = S.alerts[id];
    if (!st) continue;
    st.disp = disp; st.status = 'closed'; st.closedAt = ENG.now(); st.bulk = bulk;
    if (opts.owner) st.owner = opts.owner;
    ENG.touch(st);
    if (comment) st.comments.push({ at: ENG.now(), text: comment, by: S.cfg.analyst });
  }
  ENG.logAct('alert_disposition', { alerts: ids.slice(0, 200), count: ids.length, disposition: disp, comment: comment || undefined });
  ENG.save();
  BUS.emit('alerts');
};
ENG.updateNotables = function (ids, patch, comment) {
  for (const id of ids) {
    const st = S.alerts[id];
    if (!st) continue;
    if (patch.status) { st.status = patch.status; if (patch.status === 'closed' || patch.status === 'resolved') st.closedAt = ENG.now(); }
    if (patch.owner !== undefined) st.owner = patch.owner;
    if (patch.urgency) st.urgency = patch.urgency;
    if (patch.disp !== undefined) st.disp = patch.disp;
    if ((patch.status && patch.status !== 'new') || patch.owner || patch.disp) ENG.touch(st);
    st.bulk = ids.length > 1 ? ids.length : st.bulk;
    if (comment) st.comments.push({ at: ENG.now(), text: comment, by: S.cfg.analyst });
  }
  ENG.logAct('notable_update', { alerts: ids.slice(0, 200), count: ids.length, ...patch, comment: comment || undefined });
  ENG.save();
  BUS.emit('alerts');
};
ENG.reopen = function (id) {
  const st = S.alerts[id];
  st.status = 'new'; st.disp = null; st.closedAt = null;
  if (st.caseId) { const c = ENG.caseById(st.caseId); if (c) c.alertIds = c.alertIds.filter(x => x !== id); st.caseId = null; }
  ENG.logAct('alert_reopen', { alert: id });
  ENG.save(); BUS.emit('alerts'); BUS.emit('cases');
};
ENG.alertComment = function (id, text) {
  S.alerts[id].comments.push({ at: ENG.now(), text, by: S.cfg.analyst });
  ENG.logAct('alert_comment', { alert: id, text });
  ENG.saveSoon(); BUS.emit('alerts');
};

// ------------------------------------------------------------------ cases
ENG.caseById = id => S.cases.find(c => c.id === id);
ENG.createCase = function (data) {
  const id = 'CASE-' + (++S.caseSeq);
  const c = Object.assign({ id, title: 'Untitled case', description: '', severity: 'medium', status: 'new', category: '', mitre: '', assignee: S.cfg.analyst, tlp: 'AMBER', pap: 'AMBER', observables: [], alertIds: [], emailIds: [], comments: [], created: ENG.now(), updated: ENG.now(), actions: [] }, data);
  c.id = id;
  S.cases.push(c);
  ENG.logAct('case_create', { case: id, title: c.title, severity: c.severity });
  ENG.save(); BUS.emit('cases');
  return c;
};
ENG.createCaseFromSeed = function (seed) {
  const id = seed.id || ('CASE-' + (++S.caseSeq));
  const alertIds = (seed.alertKeys || []).map(k => S.D.alerts.find(a => a.key === k)?.id).filter(Boolean);
  const c = { id, title: seed.title, description: seed.description, severity: seed.severity || 'high', status: 'in progress', category: seed.category || '', mitre: '', assignee: S.cfg.analyst, tlp: 'AMBER', pap: 'AMBER', observables: (seed.observables || []).map(o => Object.assign({ ioc: false, note: 'added by Tier 1' }, o)), alertIds, emailIds: [], comments: (seed.comments || []).map(t => ({ at: S.D.start - 600000, text: t.text, by: t.by })), created: S.D.start - 900000, updated: S.D.start - 600000, actions: [], seeded: true };
  S.cases.push(c);
  for (const aid of alertIds) { const st = S.alerts[aid]; st.caseId = id; st.status = 'in_progress'; st.owner = S.cfg.analyst; }
};
ENG.updateCase = function (id, patch, note) {
  const c = ENG.caseById(id);
  Object.assign(c, patch); c.updated = ENG.now();
  ENG.logAct('case_update', { case: id, ...patch, note: note || undefined });
  ENG.save(); BUS.emit('cases');
};
ENG.caseComment = function (id, text) {
  const c = ENG.caseById(id);
  c.comments.push({ at: ENG.now(), text, by: S.cfg.analyst }); c.updated = ENG.now();
  ENG.logAct('case_comment', { case: id, text });
  ENG.save(); BUS.emit('cases');
};
ENG.addObservable = function (id, obs) {
  const c = ENG.caseById(id);
  if (c.observables.some(o => o.value.toLowerCase() === obs.value.toLowerCase())) return false;
  c.observables.push(Object.assign({ ioc: true, note: '' }, obs)); c.updated = ENG.now();
  ENG.logAct('case_observable', { case: id, type: obs.type, value: obs.value });
  ENG.save(); BUS.emit('cases');
  return true;
};
ENG.removeObservable = function (id, value) {
  const c = ENG.caseById(id);
  c.observables = c.observables.filter(o => o.value !== value);
  ENG.logAct('case_observable_remove', { case: id, value });
  ENG.save(); BUS.emit('cases');
};
ENG.escalate = function (alertIds, caseId) {
  const c = ENG.caseById(caseId);
  for (const id of alertIds) {
    const st = S.alerts[id];
    if (st.caseId && st.caseId !== caseId) { const old = ENG.caseById(st.caseId); if (old) old.alertIds = old.alertIds.filter(x => x !== id); }
    st.caseId = caseId; if (!st.disp) st.disp = 'tp';
    if (S.cfg.mode === 'onion') { st.status = 'closed'; st.closedAt = ENG.now(); }
    else if (st.status === 'new') st.status = 'in_progress';
    st.bulk = alertIds.length > 1 ? alertIds.length : 0;
    ENG.touch(st);
    if (!c.alertIds.includes(id)) c.alertIds.push(id);
  }
  // auto-observables like the real consoles do for escalated events
  for (const id of alertIds) {
    const a = S.D.alertById[id];
    for (const [f, type] of [['source.ip', 'ip'], ['destination.ip', 'ip']]) {
      const v = a.ev[f];
      if (v && !c.observables.some(o => o.value === v)) c.observables.push({ type, value: v, ioc: false, note: 'from ' + id, auto: true });
    }
  }
  c.updated = ENG.now();
  ENG.logAct('alert_escalate', { alerts: alertIds, case: caseId });
  ENG.save(); BUS.emit('alerts'); BUS.emit('cases');
};
ENG.linkEmailToCase = function (emailId, caseId) {
  const c = ENG.caseById(caseId);
  if (!c.emailIds.includes(emailId)) c.emailIds.push(emailId);
  ENG.logAct('email_to_case', { email: emailId, case: caseId });
  ENG.save(); BUS.emit('cases');
};

// ------------------------------------------------------------------ email
ENG.openEmail = function (id) {
  const st = S.emails[id];
  if (!st.openedAt) { st.openedAt = ENG.now(); st.status = st.status === 'new' ? 'in review' : st.status; ENG.logAct('email_open', { email: id }); ENG.saveSoon(); }
};
ENG.emailVerdict = function (id, verdict) {
  const st = S.emails[id];
  st.verdict = verdict; st.status = 'closed'; st.closedAt = ENG.now();
  ENG.logAct('email_verdict', { email: id, ...verdict });
  ENG.save(); BUS.emit('emails');
};
ENG.emailReopen = function (id) {
  const st = S.emails[id]; st.status = 'in review'; st.closedAt = null;
  ENG.logAct('email_reopen', { email: id }); ENG.save(); BUS.emit('emails');
};

// ------------------------------------------------------------------ chat
ENG.chatReply = function (chatId, optId, text) {
  const c = S.D.chat.find(x => x.id === chatId);
  const st = S.chat[chatId];
  const opt = c && c.replies ? c.replies.find(r => r.id === optId) : null;
  const msg = opt ? opt.text : text;
  if (!msg) return;
  if (c && !st.reply) {
    let cond = null;
    if (opt && opt.requires) cond = ENG.checkRequirement(opt.requires);
    st.reply = { optId: optId || null, text: msg, at: ENG.now(), conditionMet: cond };
  }
  S.chatLog.push({ id: chatId || null, from: S.cfg.analyst, text: msg, at: ENG.now(), mine: true });
  ENG.logAct('chat_reply', { chat: chatId, option: optId || undefined, text: msg });
  ENG.save(); BUS.emit('chatlog');
  if (opt && opt.followup) {
    setTimeout(() => {
      S.chatLog.push({ id: null, from: c.from, role: c.role, text: opt.followup, at: ENG.now(), mine: false });
      BUS.emit('chatlog'); ENG.saveSoon();
    }, 1800);
  }
};
ENG.checkRequirement = function (req) {
  // e.g. "incident:A:escalated"  "email:M1:closed"
  const [kind, key, what] = req.split(':');
  if (kind === 'incident') {
    const ids = S.D.alerts.filter(a => a.truth.incident === key).map(a => a.id);
    if (what === 'escalated') return ids.some(id => S.alerts[id].caseId);
  }
  if (kind === 'email') return S.emails[key] && S.emails[key].status === 'closed';
  return null;
};

// ------------------------------------------------------------------ questions
ENG.answer = function (qid, text) {
  S.questions[qid] = { answer: text, at: ENG.now() };
  ENG.logAct('question_answer', { question: qid, answer: text });
  ENG.save(); BUS.emit('questions');
};

/* ==========================================================================
   SCORING
   ========================================================================== */
const SCORE = {};
SCORE.MALICIOUS = new Set(['cred_phish', 'malware', 'bec']);
SCORE.CLASS_LABEL = { cred_phish: 'Credential phishing', malware: 'Malware delivery', bec: 'Business email compromise / fraud', spam: 'Spam / marketing', benign: 'Legitimate (benign)', sim_test: 'Authorized phishing simulation' };
SCORE.ACTION_LABEL = { purge: 'Purge from all mailboxes', block_sender: 'Block sender / domain', block_url: 'Block URL / domain at proxy', reset_creds: 'Reset affected credentials', escalate: 'Escalate to incident case', notify_reporter: 'Reply to reporter', isolate: 'Isolate affected host' };
SCORE.DISP_LABEL = { tp: 'True Positive', bp: 'Benign Positive', fp: 'False Positive' };

SCORE.alertScore = function (a, st) {
  const v = a.truth.verdict;
  const esc = !!st.caseId;
  let d;
  if (esc) d = 'tp';
  else if (st.disp) d = st.disp;
  else if (st.status === 'closed' || st.status === 'resolved') d = 'undetermined';
  else return { s: 0, outcome: 'untouched' };
  if (d === 'undetermined') {
    if (v === 'tp') return { s: 0, outcome: 'missed' };
    return { s: v === 'tp_policy' ? 0.2 : 0.5, outcome: 'closed without disposition' };
  }
  if (v === 'tp') {
    if (a.truth.escalate !== false) {
      if (esc) return { s: 1, outcome: 'correct' };
      if (d === 'tp') return { s: 0.4, outcome: 'under-escalated' };
      return { s: 0, outcome: 'missed' };
    }
    if (d === 'tp') return { s: 1, outcome: 'correct' };
    return { s: 0, outcome: 'missed' };
  }
  if (v === 'tp_policy') {
    if (esc) return { s: 0.6, outcome: 'over-escalated' };
    if (d === 'tp') return { s: 1, outcome: 'correct' };
    if (d === 'bp') return { s: 0.5, outcome: 'partly right' };
    return { s: 0.2, outcome: 'wrong' };
  }
  // benign / fp
  if (esc) return { s: 0, outcome: 'over-escalated' };
  if (d === (v === 'benign' ? 'bp' : 'fp')) return { s: 1, outcome: 'correct' };
  if (d === 'bp' || d === 'fp') return { s: 0.85, outcome: 'close enough' };
  return { s: 0.3, outcome: 'wrong' };
};

SCORE.norm = function (s) {
  return String(s ?? '').trim().toLowerCase().replace(/hxxp/g, 'http').replace(/\[\.\]/g, '.').replace(/\[@\]/g, '@').replace(/^["'`<(\[]+|["'`>)\].,]+$/g, '').replace(/\s+/g, ' ');
};
SCORE.questionScore = function (q, ans) {
  if (!ans || !String(ans.answer || '').trim()) return 0;
  const a = SCORE.norm(ans.answer);
  const accepted = (Array.isArray(q.answer) ? q.answer : [q.answer]).map(x => SCORE.norm(x));
  if (q.type === 'number') {
    const n = Number(a.replace(/[^0-9.\-]/g, ''));
    const tol = q.tolerance ?? 0;
    return accepted.some(x => Math.abs(Number(x) - n) <= tol) ? 1 : 0;
  }
  if (accepted.some(x => x === a)) return 1;
  if (q.contains && accepted.some(x => a.includes(x) || (a.length > 4 && x.includes(a)))) return 1;
  return 0;
};

SCORE.compute = function () {
  const D = S.D, end = ENG.now();
  const arrived = D.alerts.filter(a => a.ts <= end);
  const tier = D.scenario.tier;
  const per = arrived.map(a => ({ a, st: S.alerts[a.id], ...SCORE.alertScore(a, S.alerts[a.id]) }));
  const cats = [];
  const findings = { critical: [], over: [], sla: [], phish: [], good: [], notes: [] };

  // 1. Threat detection (true-positive incidents)
  const tps = per.filter(x => x.a.truth.verdict === 'tp');
  if (tps.length) {
    const byInc = {};
    for (const x of tps) (byInc[x.a.truth.incident || x.a.id] = byInc[x.a.truth.incident || x.a.id] || []).push(x);
    const incScores = Object.entries(byInc).map(([k, xs]) => xs.reduce((s, x) => s + x.s, 0) / xs.length);
    const score = incScores.reduce((a, b) => a + b, 0) / incScores.length;
    cats.push({ key: 'detection', label: 'Threat detection', score, detail: `${tps.filter(x => x.outcome === 'correct').length} of ${tps.length} malicious alerts escalated correctly across ${Object.keys(byInc).length} incident(s)` });
    for (const x of tps) {
      if (x.outcome === 'missed' || x.outcome === 'untouched') findings.critical.push({ alert: x.a.id, rule: x.a.rule, host: x.a.ev['source.ip'] + ' → ' + x.a.ev['destination.ip'], what: x.outcome === 'untouched' ? 'left open at end of shift' : `closed as ${SCORE.DISP_LABEL[x.st.disp] || x.st.disp}${x.st.bulk ? ` in a bulk action with ${x.st.bulk - 1} other alerts` : ''}`, why: x.a.truth.why });
      else if (x.outcome === 'under-escalated') findings.critical.push({ alert: x.a.id, rule: x.a.rule, host: x.a.ev['source.ip'], what: 'identified as True Positive but not escalated to a case', why: x.a.truth.why });
      else findings.good.push({ alert: x.a.id, rule: x.a.rule, ttt: x.st.firstTouch ? Math.round((x.st.firstTouch - ENG.alertArrival(x.a)) / 1000) : null });
    }
  }
  // 2. Noise & judgement
  const noise = per.filter(x => x.a.truth.verdict !== 'tp');
  if (noise.length) {
    const score = noise.reduce((s, x) => s + x.s, 0) / noise.length;
    const handled = noise.filter(x => x.outcome !== 'untouched').length;
    cats.push({ key: 'noise', label: 'Noise handling & judgement', score, detail: `${handled} of ${noise.length} benign/policy alerts dispositioned; ${noise.filter(x => x.outcome === 'correct' || x.outcome === 'close enough').length} correct` });
    for (const x of noise) if (x.outcome === 'over-escalated') findings.over.push({ alert: x.a.id, rule: x.a.rule, case: x.st.caseId, why: x.a.truth.why });
    const wrongPolicy = noise.filter(x => x.a.truth.verdict === 'tp_policy' && x.outcome === 'wrong');
    if (wrongPolicy.length) findings.notes.push(`${wrongPolicy.length} policy-violation alert(s) were closed as false positives. The detection was accurate, so close those as True Positive (policy) and note them for the owning team.`);
  }
  // 3. Case quality
  const incidents = Object.entries(D.incidents || {});
  const incCaseScores = [];
  for (const [k, inc] of incidents) {
    if (inc.escalate === false) continue;
    const ids = arrived.filter(a => a.truth.incident === k).map(a => a.id);
    const emailIds = (inc.emails || []);
    if (!ids.length && !emailIds.length) continue;
    const caseCounts = {};
    for (const id of ids) { const c = S.alerts[id].caseId; if (c) caseCounts[c] = (caseCounts[c] || 0) + 1; }
    for (const c of S.cases) for (const e of c.emailIds) if (emailIds.includes(e)) caseCounts[c.id] = (caseCounts[c.id] || 0) + 1;
    const best = Object.entries(caseCounts).sort((a, b) => b[1] - a[1])[0];
    if (!best) { incCaseScores.push({ k, s: 0, why: 'never escalated to a case' }); continue; }
    const c = ENG.caseById(best[0]);
    const escalatedIds = ids.filter(id => S.alerts[id].caseId);
    const cohesion = escalatedIds.length ? escalatedIds.filter(id => S.alerts[id].caseId === c.id).length / escalatedIds.length : 1;
    const caseAlerts = c.alertIds.map(id => D.alertById[id]).filter(Boolean);
    const purity = caseAlerts.length ? caseAlerts.filter(a => a.truth.incident === k).length / caseAlerts.length : 1;
    let comp = 0;
    const sevOrder = ['low', 'medium', 'high', 'critical'];
    if (sevOrder.indexOf(c.severity) >= sevOrder.indexOf(inc.severity || 'high') - 1) comp += 0.2;
    if ((c.description || '').trim().length >= 60) comp += 0.2;
    const exp = (inc.observables || []).map(SCORE.norm);
    const got = c.observables.filter(o => !o.auto || o.ioc).map(o => SCORE.norm(o.value));
    const gotAll = c.observables.map(o => SCORE.norm(o.value));
    let obsRecall = exp.length ? exp.filter(e => gotAll.includes(e)).length / exp.length : (got.length >= 2 ? 1 : got.length / 2);
    comp += 0.45 * obsRecall;
    if (['in progress', 'escalated', 'closed', 'resolved'].includes(c.status) || c.status === 'escalated to IR') comp += 0.15;
    const s = 0.3 * cohesion + 0.2 * purity + 0.5 * Math.min(1, comp);
    incCaseScores.push({ k, s, case: c.id, cohesion, purity, obsRecall, missingObs: exp.filter(e => !gotAll.includes(e)) });
    if (cohesion < 1) findings.notes.push(`Incident ${k} was split across several cases. Related alerts belong in one case so IR sees the whole chain.`);
    if (exp.length && obsRecall < 1) findings.notes.push(`${c.id} is missing observables: ${exp.filter(e => !gotAll.includes(e)).join(', ')}`);
  }
  if (incCaseScores.length) cats.push({ key: 'cases', label: 'Escalation & case quality', score: incCaseScores.reduce((a, x) => a + x.s, 0) / incCaseScores.length, detail: incCaseScores.map(x => `${x.k}: ${x.case || 'no case'} ${Math.round(x.s * 100)}%`).join(' · ') });

  // 4. Phishing
  const emails = D.emails.filter(e => e.reportTs <= end);
  if (emails.length) {
    const scores = emails.map(e => {
      const st = S.emails[e.id]; const t = e.truth || {};
      if (!st.verdict) { findings.phish.push({ email: e.id, subject: e.subject, what: 'not reviewed', why: t.why }); return 0; }
      const v = st.verdict; let s = 0;
      if (v.class === t.class) s += 0.6;
      else if (SCORE.MALICIOUS.has(v.class) && SCORE.MALICIOUS.has(t.class)) s += 0.35;
      const req = t.required || [];
      const got = new Set(v.actions || []);
      s += req.length ? 0.3 * req.filter(r => got.has(r)).length / req.length : 0.3;
      const harm = (t.harmful || []).filter(h => got.has(h));
      s -= 0.15 * harm.length;
      const aff = (t.affected || []).map(x => x.toLowerCase());
      const gotAff = (v.affected || []).map(x => x.toLowerCase());
      if (aff.length) s += 0.1 * (aff.filter(x => gotAff.includes(x)).length / Math.max(aff.length, gotAff.length));
      else s += gotAff.length ? 0.05 : 0.1;
      s = Math.max(0, Math.min(1, s));
      if (v.class !== t.class || s < 0.75) findings.phish.push({ email: e.id, subject: e.subject, what: `classified as ${SCORE.CLASS_LABEL[v.class] || v.class}` + (v.class !== t.class ? ` (should be ${SCORE.CLASS_LABEL[t.class]})` : '') + (req.filter(r => !got.has(r)).length ? `; missing actions: ${req.filter(r => !got.has(r)).map(r => SCORE.ACTION_LABEL[r]).join(', ')}` : '') + (harm.length ? `; harmful actions: ${harm.map(r => SCORE.ACTION_LABEL[r]).join(', ')}` : '') + (aff.length && aff.some(x => !gotAff.includes(x)) ? `; affected users missed: ${aff.filter(x => !gotAff.includes(x)).join(', ')}` : ''), why: t.why });
      return s;
    });
    cats.push({ key: 'phishing', label: 'Phishing triage', score: scores.reduce((a, b) => a + b, 0) / scores.length, detail: `${emails.filter(e => S.emails[e.id].verdict).length} of ${emails.length} reports reviewed` });
  }
  // 5. SLA
  const slaAlerts = arrived.filter(a => ENG.slaMinutes(a.sev));
  const slaRows = slaAlerts.map(a => ({ a, sla: ENG.slaState(a) })).filter(x => x.sla.done || x.sla.deadline <= end);
  if (slaRows.length) {
    const met = slaRows.filter(x => x.sla.met).length;
    cats.push({ key: 'sla', label: 'SLA compliance', score: met / slaRows.length, detail: `${met} of ${slaRows.length} high/critical/medium alerts triaged inside SLA` });
    for (const x of slaRows.filter(r => !r.sla.met)) findings.sla.push({ alert: x.a.id, sev: x.a.sev, rule: x.a.rule, by: x.sla.done ? U.fmtDur(-x.sla.left) + ' late' : 'never triaged' });
  }
  // 6. Communication
  const chats = D.chat.filter(c => c.ts <= end && c.replies && c.replies.length);
  if (chats.length) {
    const sc = chats.map(c => {
      const st = S.chat[c.id];
      if (!st.reply) return 0;
      let s;
      if (st.reply.optId) {
        const o = c.replies.find(r => r.id === st.reply.optId);
        s = o ? o.score : 0;
        if (o && o.requires && st.reply.conditionMet === false) s = Math.min(s, 0.3);
      } else s = 0.6;
      const late = c.respondWithinMin && (st.reply.at - c.ts) > c.respondWithinMin * 60000;
      return late ? s * 0.6 : s;
    });
    cats.push({ key: 'comms', label: 'Communication', score: sc.reduce((a, b) => a + b, 0) / sc.length, detail: `${chats.filter(c => S.chat[c.id].reply).length} of ${chats.length} messages answered` });
  }
  // 7. Investigation questions
  if (D.questions.length) {
    const tot = D.questions.reduce((a, q) => a + (q.points || 1), 0);
    const got = D.questions.reduce((a, q) => a + (q.points || 1) * SCORE.questionScore(q, S.questions[q.id]), 0);
    cats.push({ key: 'questions', label: 'Investigation findings', score: got / tot, detail: `${D.questions.filter(q => SCORE.questionScore(q, S.questions[q.id]) === 1).length} of ${D.questions.length} case questions answered correctly` });
  }
  // 8. Handover
  if (S.handover) {
    const h = S.handover; let s = 0;
    for (const k of ['open', 'escalated', 'notes']) if ((h[k] || '').trim().length >= 25) s += 0.2;
    const cids = S.cases.filter(c => !c.seeded || c.alertIds.length).map(c => c.id);
    const txt = [h.open, h.escalated, h.notes].join(' ').toUpperCase();
    s += cids.length ? 0.2 * cids.filter(id => txt.includes(id)).length / cids.length : 0.2;
    const openN = arrived.filter(a => !S.alerts[a.id].disp && !S.alerts[a.id].caseId).length + emails.filter(e => !S.emails[e.id].verdict).length;
    s += openN === 0 || /\d/.test(h.open || '') ? 0.2 : 0;
    cats.push({ key: 'handover', label: 'Shift handover', score: Math.min(1, s), detail: cids.length ? `references ${cids.filter(id => txt.includes(id)).length}/${cids.length} case IDs` : 'no cases to reference' });
  }

  const W = Object.assign(tier === 2
    ? { questions: 35, detection: 15, cases: 20, noise: 8, phishing: 10, sla: 4, comms: 4, handover: 8 }
    : { detection: 32, noise: 15, cases: 10, phishing: 18, sla: 10, comms: 7, handover: 8 }, D.scenario.weights || {});
  const wsum = cats.reduce((a, c) => a + (W[c.key] || 5), 0);
  for (const c of cats) c.weight = Math.round((W[c.key] || 5) / wsum * 1000) / 10;
  const total = Math.round(cats.reduce((a, c) => a + c.score * (W[c.key] || 5), 0) / wsum * 100);
  const grade = total >= 90 ? 'A' : total >= 80 ? 'B' : total >= 70 ? 'C' : total >= 60 ? 'D' : 'F';

  const touched = per.filter(x => x.st.firstTouch);
  const mttt = touched.length ? touched.reduce((a, x) => a + (x.st.firstTouch - ENG.alertArrival(x.a)), 0) / touched.length : null;
  const tpT = touched.filter(x => x.a.truth.verdict === 'tp');
  const stats = {
    alertsArrived: arrived.length, alertsHandled: per.filter(x => x.outcome !== 'untouched').length,
    alertsLeftOpen: per.filter(x => x.outcome === 'untouched').length,
    meanTimeToTriageSec: mttt === null ? null : Math.round(mttt / 1000),
    meanTimeToTriageMaliciousSec: tpT.length ? Math.round(tpT.reduce((a, x) => a + (x.st.firstTouch - ENG.alertArrival(x.a)), 0) / tpT.length / 1000) : null,
    queriesRun: S.queries.length, intelLookups: S.lookups.length, casesCreated: S.cases.filter(c => !c.seeded).length,
    pausedSec: Math.round(S.clock.pauses.reduce((a, p) => a + (p.dur || 0), 0) / 1000), pauses: S.clock.pauses.length
  };
  return { total, grade, cats, findings, stats, perAlert: per };
};

   EXPORT

ENG.buildExport = function () {
  const D = S.D;
  const score = S.score || SCORE.compute();
  const end = ENG.now();
  const alerts = D.alerts.filter(a => a.ts <= end).map(a => {
    const st = S.alerts[a.id]; const sla = ENG.slaState(a);
    return {
      id: a.id, time: U.iso(a.ts), rule: a.rule, sid: a.sid, severity: a.sev, src: a.ev['source.ip'], dst: a.ev['destination.ip'],
      analyst: { status: st.status, disposition: st.disp, case: st.caseId, owner: st.owner, comments: st.comments.map(c => ({ sim: U.iso(c.at), text: c.text })), closedInBulkOf: st.bulk || undefined,
        timeToTriageSec: st.firstTouch ? Math.round((st.firstTouch - ENG.alertArrival(a)) / 1000) : null, slaMinutes: sla ? sla.mins : null, slaMet: sla ? (sla.done ? sla.met : (sla.deadline <= end ? false : null)) : null },
      outcome: score.perAlert.find(x => x.a.id === a.id)?.outcome
    };
  });
  return {
    simulator: 'ShiftLab SOC Shift Simulator', schemaVersion: '2.0',
    session: {
      scenarioId: D.scenario.id, scenario: D.scenario.name, tier: D.scenario.tier, difficulty: D.scenario.difficulty, consoleMode: S.cfg.mode === 'onion' ? 'Onion-style (Security Onion layout)' : 'Splunk-style (ES Incident Review + SPL)',
      analyst: S.cfg.analyst, seed: S.cfg.seed, shiftLengthMin: S.cfg.lenMin, simShiftStart: U.iso(D.start), simEnded: U.iso(end), activeMinutes: +(S.clock.activeMs / 60000).toFixed(1),
      realStarted: new Date(S.clock.realStart).toISOString(), exported: new Date().toISOString(), pauses: S.clock.pauses.map(p => ({ atSim: U.iso(p.at), seconds: Math.round((p.dur || 0) / 1000), reason: p.reason }))
    },
    scorecard: { total: score.total, grade: score.grade, categories: score.cats.map(c => ({ category: c.label, weightPct: c.weight, scorePct: Math.round(c.score * 100), detail: c.detail })), stats: score.stats, findings: score.findings },
    alerts,
    cases: S.cases.map(c => ({ ...c, created: U.iso(c.created), updated: U.iso(c.updated), comments: c.comments.map(x => ({ sim: U.iso(x.at), by: x.by, text: x.text })) })),
    phishingReports: D.emails.filter(e => e.reportTs <= end).map(e => ({ id: e.id, reportedBy: e.reporter, subject: e.subject, from: e.from.address, analyst: S.emails[e.id].verdict, openedAt: S.emails[e.id].openedAt ? U.iso(S.emails[e.id].openedAt) : null, closedAt: S.emails[e.id].closedAt ? U.iso(S.emails[e.id].closedAt) : null })),
    chat: S.chatLog.map(m => ({ sim: U.iso(m.at), from: m.from, text: m.text, mine: m.mine })),
    investigationAnswers: D.questions.map(q => ({ id: q.id, question: q.q, answer: S.questions[q.id]?.answer ?? null })),
    queryLog: S.queries, intelLookups: S.lookups, actionTranscript: S.log,
    analystScratchpad: S.notesPad || '',
    handoverReport: S.handover,
    _gradingKey: {
      note: 'Ground truth for grading. Remove this block before sharing if you want a blind review.',
      alerts: D.alerts.filter(a => a.ts <= end && (a.truth.verdict === 'tp' || a.truth.verdict === 'tp_policy' || a.key)).map(a => ({ id: a.id, rule: a.rule, verdict: a.truth.verdict, escalate: a.truth.escalate, incident: a.truth.incident, why: a.truth.why })),
      noiseSummary: Object.entries(U.groupCount(D.alerts.filter(a => a.ts <= end && !a.key && a.truth.verdict !== 'tp'), a => a.rule + ' => ' + a.truth.verdict)).map(([k, n]) => ({ rule: k, count: n })),
      incidents: D.incidents, emails: D.emails.map(e => ({ id: e.id, subject: e.subject, truth: e.truth })),
      questions: D.questions.map(q => ({ id: q.id, q: q.q, answer: q.answer })), chat: D.chat.filter(c => c.replies).map(c => ({ id: c.id, text: c.text, best: c.replies.filter(r => r.score === 1).map(r => r.text) }))
    }
  };
};


'use strict';
/* ==========================================================================
   Built-in scenarios. All organizations, people and domains are fictional.
   Placeholders like {{victim.host}} are filled from randomized entities each

    const rem = ENG.remainingMs();
    cf.textContent = U.fmtDur(rem) + ' left';
    cf.className = 'clockface' + (rem < 120000 ? ' crit' : rem < 300000 ? ' low' : '');
    const st = document.getElementById('statustext');
    if (st) st.textContent = S.clock.paused ? 'Paused' : `Shift active · ${ENG.arrivedAlerts().length} alerts in queue · ${ENG.remainingMs() > 0 ? U.fmtDur(ENG.remainingMs()) + ' remaining' : 'time up'}`;
    const pb = document.getElementById('pausebtn'); if (pb) pb.hidden = S.clock.paused;
  }
  function updateBadges() {
    const openAlerts = ENG.arrivedAlerts().filter(a => { const s = S.alerts[a.id]; return !s.disp && !s.caseId && s.status !== 'closed'; }).length;
    const openMail = ENG.arrivedEmails().filter(e => S.emails[e.id].status !== 'closed').length;
    const set = (k, n, soft) => { const b = document.querySelector(`[data-badge="${k}"]`); if (!b) return; if (n > 0) { b.hidden = false; b.textContent = n; b.className = 'badge' + (soft ? ' soft' : ''); } else b.hidden = true; };
    set('alerts', openAlerts, true); set('phishing', openMail, false);
    const openQ = S.D.questions.filter(q => !S.questions[q.id]).length; set('questions', openQ, true);
  }

  function renderPage() {
    const main = document.getElementById('main'); if (!main) return;
    main.innerHTML = '';
    let node;
    switch (UI.page) {
      case 'alerts': node = S.cfg.mode === 'onion' ? pageAlertsOnion() : pageNotablesSplunk(); break;
      case 'hunt': node = pageHunt(); break;
      case 'search': node = pageHunt(); break;
      case 'cases': node = pageCases(); break;
      case 'phishing': node = pagePhishing(); break;
      case 'questions': node = pageQuestions(); break;
      case 'reference': node = pageReference(); break;
    }
    main.appendChild(node);
    updateBadges();
  }

  // helper to open a query in hunt/search
  function pivotToHunt(query) { UI.page = UI.qPage; UI.q = query; UI.qResult = null; UI.qError = null; runQuery(); renderPage(); buildNav(document.querySelector('.nav')); }

  /* ====================================================================
     ALERTS (Security Onion style)
     ==================================================================== */
  function alertRowsFiltered() {
    const now = ENG.now();
    let rows = ENG.arrivedAlerts();
    const f = UI.filter;
    if (f.sev !== 'all') rows = rows.filter(a => a.sev === f.sev);
    if (f.status === 'open') rows = rows.filter(a => { const s = S.alerts[a.id]; return !s.disp && !s.caseId && s.status !== 'closed'; });
    else if (f.status === 'closed') rows = rows.filter(a => { const s = S.alerts[a.id]; return s.disp || s.caseId || s.status === 'closed'; });
    else if (f.status === 'escalated') rows = rows.filter(a => S.alerts[a.id].caseId);
    if (f.q) { const q = f.q.toLowerCase(); rows = rows.filter(a => (a.rule + ' ' + a.ev['source.ip'] + ' ' + a.ev['destination.ip'] + ' ' + a.id + ' ' + (a.ev['rule.category'] || '')).toLowerCase().includes(q)); }
    return rows;
  }

    const listcol = h('div', { class: 'listcol' });

    listcol.appendChild(h('div', { class: 'toolbar' },
      h('div', { class: 'search-in' }, h('span', {}, '🔍'), h('input', { type: 'text', placeholder: 'Filter alerts (rule, IP, id)…', value: f.q, oninput: e => { f.q = e.target.value; rerenderList(); } })),
      segFilter('status', [{ v: 'open', l: 'Open' }, { v: 'closed', l: 'Closed' }, { v: 'escalated', l: 'Escalated' }, { v: 'all', l: 'All' }]),
      segFilter('sev', [{ v: 'all', l: 'All sev' }, { v: 'critical', l: 'Crit' }, { v: 'high', l: 'High' }, { v: 'medium', l: 'Med' }, { v: 'low', l: 'Low' }]),
      h('button', { class: 'btn sm' + (UI.groupBy ? ' primary' : ''), onclick: () => { UI.groupBy = !UI.groupBy; renderPage(); } }, '⊞ Group by rule')));

      const tb = h('tbody', {});

    function updateSelBar() {

    wrap.appendChild(listcol);
    if (UI.sel) wrap.appendChild(alertDetail(UI.sel));
    return wrap;
  }

  function alertTr(a, selSet, rerender) {
    const st = S.alerts[a.id];

    const sla = ENG.slaState(a);
    const statusCell = st.caseId ? h('span', { class: 'pill esc' }, 'Escalated') :

      st.status === 'closed' ? h('span', { class: 'pill new' }, 'Closed') : h('span', { class: 'pill new' }, 'New');
    const slaCell = sla ? (sla.done ? h('span', { class: 'sla ' + (sla.met ? 'met' : 'missed') }, sla.met ? '✓' : '✗ late')
      : h('span', { class: 'sla ' + (sla.left < 0 ? 'breach' : sla.left < sla.mins * 60000 * 0.3 ? 'warn' : 'ok') }, sla.left < 0 ? 'BREACH' : U.fmtDur(sla.left))) : h('span', { class: 'muted' }, '—');

  function bulkDisposition(ids, disp) {

  }

    listcol.appendChild(h('div', { class: 'toolbar' },

      segFilter('status', [{ v: 'open', l: 'Unassigned/New' }, { v: 'closed', l: 'Resolved/Closed' }, { v: 'escalated', l: 'Escalated' }, { v: 'all', l: 'All' }]),
      segFilter('sev', [{ v: 'all', l: 'All urgency' }, { v: 'critical', l: 'Crit' }, { v: 'high', l: 'High' }, { v: 'medium', l: 'Med' }, { v: 'low', l: 'Low' }])));

          h('td', { onclick: e => e.stopPropagation() }, h('input', { type: 'checkbox', checked: selSet.has(a.id), onchange: e => { e.target.checked ? selSet.add(a.id) : selSet.delete(a.id); renderPage(); } })),

          h('td', {}, h('div', { class: 'cellmain' }, a.rule), h('div', { class: 'cellsub' }, a.ev['rule.category'] || '')),

  /* ---- shared alert detail panel ---- */
  function alertDetail(id) {
    const a = S.D.alertById[id]; const st = S.alerts[id];
    const ev = a.ev;
    const panel = h('div', { class: 'detailpanel' });
    panel.appendChild(h('div', { class: 'dp-head' },
      h('div', { style: { display: 'flex', justifyContent: 'space-between', gap: '8px' } },
        h('span', { class: 'chip' }, a.id), h('button', { class: 'btn sm ghost', onclick: () => { UI.sel = null; renderPage(); } }, '✕')),
      h('div', { class: 'dp-title', style: { marginTop: '6px' } }, sevDot(a.sev), ' ', a.rule)));
    const body = h('div', { class: 'dp-body' });

    // key-value facts with pivots
    const kv = h('dl', { class: 'kv' });
    const addKv = (k, node) => { kv.appendChild(h('dt', {}, k)); kv.appendChild(h('dd', {}, node)); };
    addKv('Signature ID', a.sid);
    addKv('Category', ev['rule.category'] || '—');
    addKv('Severity', h('span', { class: 'sev-' + a.sev }, a.sev.toUpperCase()));
    addKv('Timestamp', U.fmtTs(a.ts));
    addKv('Source', ipNode(ev['source.ip']));
    addKv('Destination', h('span', {}, ipNode(ev['destination.ip']), ev['destination.port'] ? ':' + ev['destination.port'] : ''));
    if (ev['network.transport']) addKv('Transport', (ev['network.transport'] || '').toUpperCase());
    const sla = ENG.slaState(a);
    if (sla) addKv('SLA', h('span', { class: 'sla ' + (sla.done ? (sla.met ? 'met' : 'missed') : sla.left < 0 ? 'breach' : 'ok') }, sla.done ? (sla.met ? 'Met' : 'Missed') : (sla.left < 0 ? 'Breached' : U.fmtDur(sla.left) + ' left') + ` (target ${sla.mins}m)`));
    body.appendChild(h('div', { class: 'card' }, kv));

    // asset context
    const srcAsset = S.D.assetByIp[ev['source.ip']], dstAsset = S.D.assetByIp[ev['destination.ip']];
    if (srcAsset || dstAsset) {
      const ac = h('div', { class: 'card' }); ac.appendChild(h('div', { class: 'section-h' }, 'Asset context'));
      for (const [lbl, as] of [['Source', srcAsset], ['Destination', dstAsset]]) if (as) {
        const who = as.owner || (as.role === 'device' ? as.kind : as.desc ? null : 'server');
        const parts = [as.name, who, as.subnet || as.dept, 'criticality ' + (as.crit || 'medium'), as.desc].filter(Boolean);
        ac.appendChild(h('div', { style: { fontSize: '12.5px', marginBottom: '4px' } }, h('b', {}, lbl + ': '), parts.join(' · ')));
      }
      body.appendChild(ac);
    }

    // pivots
    const pv = h('div', { class: 'card' });
    pv.appendChild(h('div', { class: 'section-h' }, 'Pivot & investigate'));
    pv.appendChild(h('div', { class: 'actionrow' },
      h('button', { class: 'btn sm', onclick: () => pivotFlow(a) }, '🔗 Related flow (uid)'),
      h('button', { class: 'btn sm', onclick: () => pivotHost(ev['source.ip']) }, 'All from ' + ev['source.ip']),
      h('button', { class: 'btn sm', onclick: () => pivotDest(ev['destination.ip']) }, 'Who talked to ' + ev['destination.ip']),
      !U.isInternal(ev['destination.ip']) && h('button', { class: 'btn sm', onclick: () => openIntel(ev['destination.ip']) }, '🌐 Look up ' + ev['destination.ip'])));
    body.appendChild(pv);

    // comments
    const cc = h('div', { class: 'card' });
    cc.appendChild(h('div', { class: 'section-h' }, 'Analyst notes'));
    for (const c of st.comments) cc.appendChild(h('div', { class: 'comment' }, c.text, h('div', { class: 'by' }, c.by + ' · ' + U.fmtClock(c.at))));
    const noteIn = h('textarea', { id: 'alertnote', placeholder: 'Add an investigation note…' });
    cc.appendChild(noteIn);
    cc.appendChild(h('button', { class: 'btn sm', style: { marginTop: '6px' }, onclick: () => { if (noteIn.value.trim()) { ENG.alertComment(id, noteIn.value.trim()); noteIn.value = ''; } } }, 'Add note'));
    body.appendChild(cc);

    // disposition actions
    const act = h('div', { class: 'card' });
    act.appendChild(h('div', { class: 'section-h' }, 'Disposition'));
    if (st.caseId) {
      act.appendChild(h('div', { style: { fontSize: '12.5px', marginBottom: '8px' } }, 'Escalated to ', h('a', { href: '#', onclick: e => { e.preventDefault(); UI.page = 'cases'; UI.selCase = st.caseId; renderPage(); buildNav(document.querySelector('.nav')); } }, st.caseId)));
      act.appendChild(h('button', { class: 'btn sm ghost', onclick: () => { ENG.reopen(id); renderPage(); } }, 'Reopen / remove from case'));
    } else {
      const comment = () => (document.getElementById('alertnote') || {}).value || '';
      act.appendChild(h('div', { class: 'actionrow' },
        h('button', { class: 'btn sm', onclick: () => { ENG.disposition([id], 'bp', comment()); toast('Closed · Benign Positive', 'good'); renderPage(); } }, 'Benign Positive'),
        h('button', { class: 'btn sm', onclick: () => { ENG.disposition([id], 'fp', comment()); toast('Closed · False Positive', 'good'); renderPage(); } }, 'False Positive'),
        h('button', { class: 'btn sm', onclick: () => { ENG.disposition([id], 'tp', comment()); toast('Closed · True Positive', 'good'); renderPage(); } }, 'True Positive (no escalation)'),
        h('button', { class: 'btn sm primary', onclick: () => openEscalateModal([id]) }, '⬆ Escalate to case')));
      act.appendChild(h('div', { class: 'muted', style: { fontSize: '11.5px', marginTop: '6px' } }, 'True Positive = accurate detection. Escalate it to a case only if it is malicious and needs IR. Policy-only true positives can be closed with a note.'));
    }
    body.appendChild(act);
    panel.appendChild(body);
    return panel;
  }

  function ipNode(ip) {
    const internal = U.isInternal(ip);
    return h('span', { class: 'pivot mono', title: internal ? 'internal asset' : 'external — click to look up', onclick: () => internal ? openAsset(ip) : openIntel(ip) }, ip);
  }
  function pivotFlow(a) { const uid = a.ev['log.id.uid']; pivotToHunt(S.cfg.mode === 'onion' ? `log.id.uid:${uid}` : `index=* uid=${uid}`); }
  function pivotHost(ip) { pivotToHunt(S.cfg.mode === 'onion' ? `source.ip:${ip}` : `index=* src_ip=${ip}`); }
  function pivotDest(ip) { pivotToHunt(S.cfg.mode === 'onion' ? `destination.ip:${ip} | groupby source.ip` : `index=zeek dest_ip=${ip} | stats count by src_ip`); }

  /* ====================================================================
     HUNT / SEARCH
     ==================================================================== */
  const RANGES = [{ l: '15m', v: 15 * 60e3 }, { l: '1h', v: 3600e3 }, { l: '4h', v: 4 * 3600e3 }, { l: '24h', v: 24 * 3600e3 }, { l: 'Shift', v: 'shift' }, { l: 'All', v: 'all' }];
  function rangeMs() { const r = UI.qRange; if (r === 'all') return null; if (r === 'shift') return ENG.elapsedMs() + 60e3; return r; }

  function runQuery() {
    const mode = S.cfg.mode;
    try {
      const evs = ENG.visibleEvents(rangeMs());
      let res;
      if (mode === 'onion') { const r = Q.runOnion(UI.q, evs.map(Q.soView)); res = { mode, events: r.events, groups: r.groups }; }
      else { const r = Q.runSPL(UI.q, evs); res = { mode, rows: r.rows, stats: r.stats, columns: r.columns }; }
      UI.qResult = res; UI.qError = null;
      const count = mode === 'onion' ? res.events.length : res.rows.length;
      ENG.logQuery(UI.qPage, UI.q, String(UI.qRange), count);
    } catch (e) { UI.qError = e.message; UI.qResult = null; ENG.logQuery(UI.qPage, UI.q, String(UI.qRange), 0, e.message); }
  }

  function pageHunt() {
    const mode = S.cfg.mode;
    const wrap = h('div', { class: 'huntwrap' });
    const prefix = mode === 'onion' ? '' : '';
    const ta = h('textarea', { id: 'qbox', placeholder: mode === 'onion' ? 'event.dataset:zeek.dns AND source.ip:10.2.0.5   |   groupby dns.query.name' : 'index=zeek sourcetype=zeek:conn dest_ip=203.0.113.9 | timechart span=5m count', value: UI.q,
      onkeydown: e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); UI.q = ta.value; runQuery(); drawResults(); } }, oninput: e => { UI.q = e.target.value; ta.style.height = 'auto'; ta.style.height = Math.min(120, ta.scrollHeight) + 'px'; } });
    const bar = h('div', { class: 'querybar' },
      h('div', { class: 'qrow' },
        h('div', { class: 'qinput' }, mode === 'splunk' ? h('span', { class: 'prefix' }, 'search') : h('span', { class: 'prefix' }, '≡'), ta),

      h('div', { class: 'gradecircle', style: { borderColor: gradeColor, color: gradeColor } }, sc.grade),
      h('div', {}, h('div', { style: { fontSize: '30px', fontWeight: 800 } }, sc.total + '%'),
        h('div', { class: 'muted' }, `${S.D.scenario.name} · Tier ${S.D.scenario.tier} · ${S.cfg.mode === 'onion' ? 'Onion' : 'Splunk'} mode · ${S.cfg.lenMin}m`),
        h('div', { class: 'muted', style: { fontSize: '12px' } }, `${sc.stats.alertsHandled}/${sc.stats.alertsArrived} alerts handled · ${sc.stats.casesCreated} case(s) · ${sc.stats.queriesRun} queries`))));
    // categories
    body.appendChild(h('div', { class: 'section-h', style: { marginTop: '12px' } }, 'Scorecard by category'));
    for (const c of sc.cats) {
      const pct = Math.round(c.score * 100); const col = pct >= 80 ? 'var(--good)' : pct >= 60 ? 'var(--med)' : 'var(--crit)';
      body.appendChild(h('div', { class: 'catbar' },
        h('div', { class: 'top' }, h('span', {}, h('b', {}, c.label), h('span', { class: 'muted' }, ' · ' + c.weight + '% of grade')), h('span', { style: { color: col, fontWeight: 700 } }, pct + '%')),
        h('div', { class: 'track' }, h('div', { class: 'fill', style: { width: pct + '%', background: col } })),
        h('div', { class: 'muted', style: { fontSize: '11.5px', marginTop: '2px' } }, c.detail)));
    }
    // stats
    body.appendChild(h('div', { class: 'section-h', style: { marginTop: '16px' } }, 'Shift statistics'));
    const stat = (n, l) => h('div', { class: 'stat' }, h('div', { class: 'n' }, n), h('div', { class: 'l' }, l));
    body.appendChild(h('div', { class: 'statgrid' },
      stat(sc.stats.meanTimeToTriageSec === null ? '—' : U.fmtDur(sc.stats.meanTimeToTriageSec * 1000), 'Mean time to triage'),
      stat(sc.stats.meanTimeToTriageMaliciousSec === null ? '—' : U.fmtDur(sc.stats.meanTimeToTriageMaliciousSec * 1000), 'MTTT (malicious)'),
      stat(sc.stats.alertsLeftOpen, 'Left open at end'),
      stat(sc.stats.queriesRun, 'Queries run'),
      stat(sc.stats.intelLookups, 'Intel lookups'),
      stat(sc.stats.pausedSec ? U.fmtDur(sc.stats.pausedSec * 1000) : '0:00', 'Paused (excluded)')));
    // findings
    const F = sc.findings;
    const fsec = (title, arr, cls, fmt) => { if (!arr.length) return; body.appendChild(h('div', { class: 'section-h', style: { marginTop: '16px' } }, title)); for (const x of arr) body.appendChild(h('div', { class: 'finding ' + cls }, fmt(x))); };
    fsec('🔴 Missed or mishandled threats', F.critical, 'bad', x => h('div', {}, h('b', {}, x.alert + ' · ' + x.rule), h('div', {}, x.what), h('div', { class: 'muted', style: { marginTop: '3px' } }, '→ ' + x.why)));
    fsec('🟠 Over-escalation (benign closed as incident)', F.over, 'warn', x => h('div', {}, h('b', {}, x.alert + ' · ' + x.rule), h('div', { class: 'muted' }, x.why)));
    fsec('🟠 Phishing calls to review', F.phish, 'warn', x => h('div', {}, h('b', {}, x.email + ' · ' + U.trunc(x.subject, 50)), h('div', {}, x.what), x.why ? h('div', { class: 'muted', style: { marginTop: '3px' } }, '→ ' + x.why) : null));
    fsec('🟠 SLA misses', F.sla, 'warn', x => h('div', {}, h('b', {}, x.alert + ' (' + x.sev + ')'), ' ' + x.rule + ' — ' + x.by));
    fsec('📝 Notes for improvement', F.notes.map(n => ({ n })), 'warn', x => x.n);
    fsec('🟢 Good calls', F.good.slice(0, 6), 'good', x => h('div', {}, h('b', {}, x.alert + ' · ' + x.rule), x.ttt != null ? h('span', { class: 'muted' }, '  triaged in ' + U.fmtDur(x.ttt * 1000)) : null));

    // export
    body.appendChild(h('div', { class: 'section-h', style: { marginTop: '18px' } }, 'Export for grading'));
    body.appendChild(h('div', { class: 'muted', style: { fontSize: '12px', marginBottom: '8px' } }, 'Download the full transcript (every query, disposition, case, phishing verdict, your handover, timing, and the answer key) and upload it in a new chat for CySA+-level feedback.'));
    body.appendChild(h('div', { class: 'actionrow' },
      h('button', { class: 'btn primary', onclick: () => doExport() }, '⬇ Download results JSON'),
      h('button', { class: 'btn', onclick: () => showJsonModal() }, 'View / copy JSON'),
      h('button', { class: 'btn ghost', onclick: () => { ENG.clearSave(); closeModal(); renderLauncher(null); } }, 'New shift')));
    showModal('Shift Scorecard · ' + sc.grade + ' (' + sc.total + '%)', body, true, true);
  }

  async function doExport() {
    const data = ENG.buildExport();
    const json = JSON.stringify(data, null, 2);
    const fname = 'shiftlab_results_' + new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19) + '.json';
    if (downloadsCap) {
      try { await downloadsCap.save({ filename: fname, data: json }); toast('Saved ' + fname, 'good'); return; }
      catch (e) { if (e && e.code === 'declined') { toast('Download cancelled', 'bad'); return; } }
    }
    // fallback: blob download (works in standalone file / normal browser)
    try {
      const blob = new Blob([json], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = h('a', { href: url, download: fname }); document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
      toast('Downloaded ' + fname, 'good');
    } catch (e) { showJsonModal(); }
  }
  function showJsonModal() {
    const json = JSON.stringify(ENG.buildExport(), null, 2);
    const body = h('div', {});
    body.appendChild(h('div', { class: 'muted', style: { marginBottom: '8px' } }, 'Select all and copy, then paste into a file named results.json (or straight into a new chat).'));
    const ta = h('textarea', { style: { minHeight: '320px', fontFamily: 'var(--mono)', fontSize: '11.5px' }, readonly: true }, ); ta.value = json;
    body.appendChild(ta);
    body.appendChild(h('button', { class: 'btn primary', style: { marginTop: '8px' }, onclick: () => { ta.select(); try { navigator.clipboard.writeText(json); toast('Copied', 'good'); } catch (e) { document.execCommand && document.execCommand('copy'); } } }, 'Copy to clipboard'));
    showModal('Results JSON', body, true, true);
  }

  /* ====================================================================
     MODAL PRIMITIVES
     ==================================================================== */
  function showModal(title, bodyNode, noClose, wide) {
    closeModal();
    const ov = h('div', { class: 'overlay', id: 'modal', onclick: e => { if (e.target === ov && !noClose) closeModal(); } },
      h('div', { class: 'modal' + (wide ? ' wide' : '') },
        h('div', { class: 'mh' }, h('h2', {}, title), noClose ? null : h('button', { class: 'btn sm ghost', onclick: closeModal }, '✕')),
        h('div', { class: 'mb' }, bodyNode)));
    document.body.appendChild(ov);
  }
  function closeModal() { const m = document.getElementById('modal'); if (m) m.remove(); }

  /* ====================================================================
     BOOTSTRAP
     ==================================================================== */
  try { window.__ShiftLab = { S, ENG, SCORE, GEN, Q, BUS, SCENARIOS, U, LIB, render: renderPage }; } catch (e) {}
  function go() { try { UI.boot(); } catch (e) { app.innerHTML = '<div style="padding:30px;font-family:monospace;color:#f85149">Boot error: ' + U.esc(e.message) + '<br><pre>' + U.esc(e.stack || '') + '</pre></div>'; } }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', go); else go();

})();
</script>
