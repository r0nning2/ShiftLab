<title>ShiftLab SOC</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* ShiftLab SOC — console styling.
   Two skins share one layout; [data-skin="onion"] and [data-skin="splunk"]
   retint. Dark-first (SOC consoles are dark) with a light mode. */
:root {
  --bg: #0e1116; --bg2: #161b22; --bg3: #1c2230; --panel: #141a22; --panel2: #1a212c;
  --edge: #2a3341; --edge2: #38445a; --fg: #e6edf3; --fg2: #aeb9c7; --fg3: #7d8a9c;
  --accent: #2f81f7; --accent2: #1f6feb; --accentFg: #ffffff;
  --crit: #f85149; --high: #fb8500; --med: #e3b341; --low: #58a6ff; --info: #7d8a9c;
  --good: #3fb950; --bad: #f85149; --warn: #e3b341; --mag: #bc8cff; --chipbg: #21262d;
  --mono: 'SFMono-Regular', ui-monospace, 'Cascadia Code', 'JetBrains Mono', Menlo, Consolas, monospace;
  --sans: 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif;
  --shadow: 0 6px 24px rgba(0,0,0,.4); --r: 7px;
  color-scheme: dark;
}
:root[data-skin="onion"] { --accent: #16b1a7; --accent2: #0d9488; --low: #2dd4bf; }
:root[data-skin="splunk"] { --accent: #5a9e3f; --accent2: #65a637; --low: #8bc34a; }
:root[data-theme="light"] {
  --bg: #eef1f5; --bg2: #f6f8fa; --bg3: #e7ebf0; --panel: #ffffff; --panel2: #f6f8fa;
  --edge: #d0d7de; --edge2: #b9c2cd; --fg: #1c2128; --fg2: #4a5568; --fg3: #6e7a8a;
  --accentFg:#fff; --chipbg:#eaeef2; --crit:#cf222e; --high:#bc4c00; --med:#9a6700; --good:#1a7f37; --shadow:0 6px 20px rgba(80,90,110,.18);
  color-scheme: light;
}
:root[data-skin="onion"][data-theme="light"] { --accent:#0d9488; --accent2:#0b7c72; }
:root[data-skin="splunk"][data-theme="light"] { --accent:#4e8a2f; --accent2:#3f7024; }

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 13.5px; line-height: 1.45; -webkit-font-smoothing: antialiased; overflow: hidden; }
#app { height: 100%; }
button { font-family: inherit; cursor: pointer; }
a { color: var(--accent); }
::-webkit-scrollbar { width: 11px; height: 11px; }
::-webkit-scrollbar-thumb { background: var(--edge2); border-radius: 6px; border: 2px solid transparent; background-clip: padding-box; }
::-webkit-scrollbar-track { background: transparent; }

/* ---------- generic atoms ---------- */
.btn { background: var(--bg3); color: var(--fg); border: 1px solid var(--edge2); border-radius: var(--r); padding: 6px 12px; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.btn:hover { border-color: var(--accent); color: var(--fg); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accentFg); }
.btn.primary:hover { background: var(--accent2); }
.btn.danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, var(--edge2)); }
.btn.danger:hover { background: color-mix(in srgb, var(--bad) 18%, transparent); border-color: var(--bad); }
.btn.sm { padding: 3px 8px; font-size: 12px; font-weight: 600; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--fg2); }
.btn.ghost:hover { background: var(--bg3); color: var(--fg); }
.chip { display: inline-flex; align-items: center; gap: 5px; background: var(--chipbg); border: 1px solid var(--edge); border-radius: 20px; padding: 2px 9px; font-size: 11.5px; color: var(--fg2); }
.chip.on { background: var(--accent); color: var(--accentFg); border-color: var(--accent); }
.tag { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .4px; padding: 2px 7px; border-radius: 4px; }
.mono { font-family: var(--mono); }
.muted { color: var(--fg3); }
.pivot { cursor: pointer; border-bottom: 1px dotted var(--edge2); }
.pivot:hover { color: var(--accent); border-bottom-color: var(--accent); }
.sev-critical { color: var(--crit); } .sev-high { color: var(--high); } .sev-medium { color: var(--med); } .sev-low { color: var(--low); } .sev-info { color: var(--info); }
.sevdot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; }
.bg-critical { background: var(--crit); } .bg-high { background: var(--high); } .bg-medium { background: var(--med); } .bg-low { background: var(--low); } .bg-info { background: var(--info); }
.pill { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .3px; padding: 2px 8px; border-radius: 20px; border: 1px solid; }
.pill.new { color: var(--fg2); border-color: var(--edge2); }
.pill.tp, .pill.closed-tp { color: var(--crit); border-color: var(--crit); background: color-mix(in srgb, var(--crit) 12%, transparent); }
.pill.fp { color: var(--good); border-color: var(--good); background: color-mix(in srgb, var(--good) 12%, transparent); }
.pill.bp { color: var(--low); border-color: var(--low); background: color-mix(in srgb, var(--low) 12%, transparent); }
.pill.esc, .pill.escalated { color: var(--mag); border-color: var(--mag); background: color-mix(in srgb, var(--mag) 14%, transparent); }
.pill.in_progress, .pill.in-review { color: var(--med); border-color: var(--med); }

/* ---------- app shell ---------- */
.shell { display: grid; grid-template-rows: auto 1fr auto; height: 100%; }
.topbar { display: flex; align-items: center; gap: 12px; padding: 0 14px; height: 46px; background: var(--bg2); border-bottom: 1px solid var(--edge); z-index: 30; }
.brand { font-weight: 800; letter-spacing: .3px; display: flex; align-items: center; gap: 8px; }
.brand .logo { width: 22px; height: 22px; border-radius: 6px; background: linear-gradient(135deg, var(--accent), var(--mag)); display: grid; place-items: center; color: #fff; font-size: 13px; font-weight: 900; }
.brand .skinname { font-size: 11px; color: var(--fg3); font-weight: 600; background: var(--bg3); padding: 2px 7px; border-radius: 5px; }
.nav { display: flex; gap: 2px; margin-left: 6px; flex: 1; overflow-x: auto; }
.nav button { background: transparent; border: none; color: var(--fg2); padding: 6px 12px; border-radius: 6px; font-size: 13px; font-weight: 600; position: relative; display: flex; align-items: center; gap: 7px; }
.nav button:hover { background: var(--bg3); color: var(--fg); }
.nav button.active { color: var(--fg); background: var(--bg3); }
.nav button.active::after { content: ''; position: absolute; left: 10px; right: 10px; bottom: -1px; height: 2px; background: var(--accent); border-radius: 2px; }
.nav .badge { background: var(--crit); color: #fff; font-size: 10px; font-weight: 800; border-radius: 10px; padding: 0 5px; min-width: 16px; text-align: center; }
.nav .badge.soft { background: var(--edge2); color: var(--fg); }
.clockbox { display: flex; align-items: center; gap: 10px; }
.clockface { font-family: var(--mono); font-size: 14px; font-weight: 700; padding: 3px 9px; background: var(--bg3); border-radius: 6px; border: 1px solid var(--edge); }
.clockface.low { color: var(--high); border-color: var(--high); }
.clockface.crit { color: var(--crit); border-color: var(--crit); animation: pulse 1.4s infinite; }
@keyframes pulse { 50% { opacity: .55; } }

.main { overflow: hidden; position: relative; }
.page { height: 100%; overflow: auto; }
.statusbar { height: 26px; background: var(--bg2); border-top: 1px solid var(--edge); display: flex; align-items: center; gap: 14px; padding: 0 14px; font-size: 11.5px; color: var(--fg3); }
.statusbar .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--good); box-shadow: 0 0 6px var(--good); }

/* ---------- alerts / notables ---------- */
.split { display: grid; grid-template-columns: 1fr; height: 100%; }
.split.detail { grid-template-columns: 1fr 420px; }
.listcol { overflow: auto; border-right: 1px solid var(--edge); }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 9px 12px; position: sticky; top: 0; background: var(--bg); border-bottom: 1px solid var(--edge); z-index: 10; }
.search-in { flex: 1; min-width: 160px; display: flex; align-items: center; gap: 7px; background: var(--panel); border: 1px solid var(--edge2); border-radius: var(--r); padding: 5px 9px; }
.search-in input { flex: 1; background: transparent; border: none; color: var(--fg); font-size: 13px; outline: none; }
.selbar { padding: 7px 12px; background: var(--bg3); border-bottom: 1px solid var(--edge); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; position: sticky; top: 49px; z-index: 9; }
table.grid { width: 100%; border-collapse: collapse; font-size: 12.5px; }
table.grid th { position: sticky; top: 0; background: var(--bg2); text-align: left; padding: 7px 10px; color: var(--fg3); font-weight: 700; font-size: 11px; text-transform: uppercase; letter-spacing: .4px; border-bottom: 1px solid var(--edge); white-space: nowrap; z-index: 5; }
table.grid td { padding: 7px 10px; border-bottom: 1px solid var(--edge); vertical-align: top; }
table.grid tr.row { cursor: pointer; }
table.grid tr.row:hover td { background: var(--panel2); }
table.grid tr.row.sel td { background: color-mix(in srgb, var(--accent) 14%, transparent); }
table.grid tr.row.active td { background: color-mix(in srgb, var(--accent) 22%, transparent); box-shadow: inset 3px 0 0 var(--accent); }
table.grid tr.closed td { opacity: .5; }
table.grid tr.grp td { background: var(--bg2); font-weight: 700; color: var(--fg2); cursor: pointer; }
.cellmain { font-weight: 600; color: var(--fg); }
.cellsub { color: var(--fg3); font-size: 11.5px; }
.countpill { background: var(--bg3); border: 1px solid var(--edge2); border-radius: 20px; padding: 1px 8px; font-size: 11px; font-weight: 700; font-family: var(--mono); }
.sla { font-family: var(--mono); font-size: 11.5px; font-weight: 700; padding: 1px 6px; border-radius: 4px; }
.sla.ok { color: var(--good); } .sla.warn { color: var(--med); } .sla.breach { color: var(--crit); background: color-mix(in srgb, var(--crit) 14%, transparent); }
.sla.met { color: var(--good); } .sla.missed { color: var(--crit); }

/* ---------- detail panel ---------- */
.detailpanel { overflow: auto; background: var(--panel); display: flex; flex-direction: column; }
.dp-head { padding: 13px 15px; border-bottom: 1px solid var(--edge); position: sticky; top: 0; background: var(--panel); z-index: 5; }
.dp-title { font-size: 14.5px; font-weight: 700; line-height: 1.3; }
.dp-body { padding: 13px 15px; display: flex; flex-direction: column; gap: 14px; }
.kv { display: grid; grid-template-columns: 116px 1fr; gap: 3px 10px; font-size: 12.5px; }
.kv dt { color: var(--fg3); }
.kv dd { margin: 0; font-family: var(--mono); word-break: break-word; }
.section-h { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .6px; color: var(--fg3); margin: 0 0 6px; }
.card { background: var(--bg2); border: 1px solid var(--edge); border-radius: var(--r); padding: 11px 12px; }
.actionrow { display: flex; flex-wrap: wrap; gap: 7px; }
textarea, input[type=text], select { font-family: var(--sans); font-size: 13px; background: var(--panel); color: var(--fg); border: 1px solid var(--edge2); border-radius: 6px; padding: 7px 9px; width: 100%; outline: none; }
textarea:focus, input:focus, select:focus { border-color: var(--accent); }
textarea { resize: vertical; min-height: 54px; line-height: 1.5; }
.comment { background: var(--bg3); border-left: 2px solid var(--edge2); padding: 6px 9px; border-radius: 0 5px 5px 0; font-size: 12.5px; margin-bottom: 5px; }
.comment .by { color: var(--fg3); font-size: 11px; }
.empty { display: grid; place-items: center; height: 100%; color: var(--fg3); text-align: center; padding: 30px; }
.empty .big { font-size: 15px; color: var(--fg2); margin-bottom: 6px; }

/* ---------- hunt / search ---------- */
.huntwrap { display: flex; flex-direction: column; height: 100%; }
.querybar { padding: 11px 13px; border-bottom: 1px solid var(--edge); background: var(--bg2); display: flex; flex-direction: column; gap: 9px; }
.qrow { display: flex; gap: 8px; align-items: stretch; }
.qinput { flex: 1; display: flex; background: var(--panel); border: 1px solid var(--edge2); border-radius: var(--r); overflow: hidden; }
.qinput .prefix { background: var(--bg3); color: var(--fg3); padding: 8px 10px; font-family: var(--mono); font-size: 12px; border-right: 1px solid var(--edge2); display: flex; align-items: center; }
.qinput textarea { border: none; border-radius: 0; background: transparent; font-family: var(--mono); font-size: 13px; min-height: 20px; padding: 8px 10px; resize: none; overflow: hidden; }
.timepick { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
.qmeta { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--fg3); }
.qerror { color: var(--crit); font-family: var(--mono); font-size: 12px; background: color-mix(in srgb, var(--crit) 10%, transparent); border: 1px solid color-mix(in srgb, var(--crit) 40%, transparent); border-radius: 6px; padding: 7px 10px; }
.hist { display: flex; align-items: flex-end; gap: 1px; height: 54px; padding: 6px 13px; border-bottom: 1px solid var(--edge); background: var(--panel); }
.hist .bar { flex: 1; background: var(--accent); min-height: 1px; border-radius: 1px 1px 0 0; opacity: .8; }
.hist .bar:hover { opacity: 1; }
.results { flex: 1; overflow: auto; }
.rawrow { font-family: var(--mono); font-size: 12px; padding: 8px 12px; border-bottom: 1px solid var(--edge); white-space: pre-wrap; word-break: break-word; cursor: pointer; }
.rawrow:hover { background: var(--panel2); }
.rawrow .t { color: var(--accent); }
.rawrow .exp { margin-top: 7px; display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; }
.rawrow .exp .k { color: var(--fg3); }
.rawrow .exp .v { color: var(--fg); word-break: break-word; }
.fieldbar { padding: 7px 12px; font-size: 12px; color: var(--fg3); border-bottom: 1px solid var(--edge); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.cheatlist { display: flex; flex-direction: column; gap: 4px; }
.cheatlist .c { display: flex; gap: 8px; padding: 6px 8px; border-radius: 6px; cursor: pointer; align-items: baseline; }
.cheatlist .c:hover { background: var(--bg3); }
.cheatlist .c .lbl { color: var(--fg2); font-size: 12px; min-width: 150px; }
.cheatlist .c code { color: var(--accent); font-size: 11.5px; }

/* ---------- cases ---------- */
.caselist { display: flex; flex-direction: column; gap: 0; }
.caseitem { padding: 11px 13px; border-bottom: 1px solid var(--edge); cursor: pointer; }
.caseitem:hover { background: var(--panel2); }
.caseitem.active { background: color-mix(in srgb, var(--accent) 16%, transparent); box-shadow: inset 3px 0 0 var(--accent); }
.obs { display: flex; align-items: center; gap: 8px; padding: 5px 8px; background: var(--bg3); border-radius: 5px; margin-bottom: 4px; font-size: 12px; }
.obs .ty { font-size: 10px; text-transform: uppercase; color: var(--fg3); font-weight: 700; min-width: 52px; }

/* ---------- email ---------- */
.maillist { overflow: auto; border-right: 1px solid var(--edge); }
.mailitem { padding: 10px 13px; border-bottom: 1px solid var(--edge); cursor: pointer; display: flex; flex-direction: column; gap: 3px; }
.mailitem:hover { background: var(--panel2); }
.mailitem.active { background: color-mix(in srgb, var(--accent) 16%, transparent); box-shadow: inset 3px 0 0 var(--accent); }
.mailitem.unread .subj { font-weight: 800; }
.mailitem .subj { font-size: 13px; }
.mailitem .meta { font-size: 11.5px; color: var(--fg3); display: flex; gap: 8px; }
.mailview { overflow: auto; background: var(--panel); }
.mailhdr { padding: 13px 16px; border-bottom: 1px solid var(--edge); }
.authrow { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 8px; }
.authbadge { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 5px; font-family: var(--mono); }
.authbadge.pass { color: var(--good); background: color-mix(in srgb, var(--good) 14%, transparent); }
.authbadge.fail { color: var(--crit); background: color-mix(in srgb, var(--crit) 14%, transparent); }
.authbadge.none { color: var(--med); background: color-mix(in srgb, var(--med) 14%, transparent); }
.mailbody { padding: 16px; background: var(--panel2); border: 1px solid var(--edge); border-radius: var(--r); margin: 13px 16px; color: var(--fg); font-size: 13px; }
.mailbody a.mail-link { color: var(--accent); text-decoration: underline; cursor: pointer; }
.hoverurl { position: fixed; bottom: 32px; left: 10px; background: #000; color: #fff; font-family: var(--mono); font-size: 11.5px; padding: 4px 9px; border-radius: 5px; z-index: 60; max-width: 90%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rawhdr { font-family: var(--mono); font-size: 11.5px; white-space: pre-wrap; word-break: break-word; background: var(--bg); border: 1px solid var(--edge); border-radius: 6px; padding: 11px; margin: 0 16px; color: var(--fg2); }
.rawhdr .hn { color: var(--accent); }

/* ---------- chat ---------- */
.chat-fab { position: fixed; right: 16px; bottom: 36px; width: 50px; height: 50px; border-radius: 50%; background: var(--accent); color: #fff; border: none; display: grid; place-items: center; box-shadow: var(--shadow); z-index: 50; font-size: 20px; }
.chat-fab .badge { position: absolute; top: -3px; right: -3px; background: var(--crit); color: #fff; border-radius: 10px; font-size: 10px; font-weight: 800; padding: 1px 5px; }
.chatpanel { position: fixed; right: 16px; bottom: 36px; width: 340px; max-width: calc(100vw - 24px); height: 460px; max-height: calc(100vh - 90px); background: var(--panel); border: 1px solid var(--edge2); border-radius: 12px; box-shadow: var(--shadow); z-index: 55; display: flex; flex-direction: column; overflow: hidden; }
.chatpanel .h { padding: 11px 13px; border-bottom: 1px solid var(--edge); display: flex; align-items: center; justify-content: space-between; background: var(--bg2); }
.chatmsgs { flex: 1; overflow: auto; padding: 12px; display: flex; flex-direction: column; gap: 9px; }
.msg { max-width: 82%; padding: 8px 11px; border-radius: 12px; font-size: 12.5px; line-height: 1.4; }
.msg .who { font-size: 10.5px; color: var(--fg3); margin-bottom: 2px; font-weight: 700; }
.msg.them { background: var(--bg3); align-self: flex-start; border-bottom-left-radius: 3px; }
.msg.me { background: var(--accent); color: var(--accentFg); align-self: flex-end; border-bottom-right-radius: 3px; }
.msg.them.lead { border-left: 2px solid var(--mag); }
.replies { padding: 10px; border-top: 1px solid var(--edge); display: flex; flex-direction: column; gap: 6px; background: var(--bg2); }
.replies button { text-align: left; background: var(--panel); border: 1px solid var(--edge2); border-radius: 8px; padding: 7px 10px; font-size: 12px; color: var(--fg); }
.replies button:hover { border-color: var(--accent); background: var(--panel2); }

/* ---------- modal / overlay ---------- */
.overlay { position: fixed; inset: 0; background: rgba(2,5,10,.74); backdrop-filter: blur(3px); z-index: 100; display: grid; place-items: center; padding: 18px; }
.modal { background: var(--panel); border: 1px solid var(--edge2); border-radius: 14px; box-shadow: var(--shadow); width: 100%; max-width: 680px; max-height: 92vh; overflow: auto; }
.modal.wide { max-width: 940px; }
.modal .mh { padding: 16px 20px; border-bottom: 1px solid var(--edge); display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; background: var(--panel); z-index: 2; }
.modal .mb { padding: 18px 20px; }
.modal h2 { margin: 0; font-size: 17px; }
.pausecard { text-align: center; max-width: 420px; }
.pausecard .big { font-size: 30px; font-weight: 800; margin: 6px 0; }

/* ---------- setup / launcher ---------- */
.launch { height: 100%; overflow: auto; background: radial-gradient(1200px 600px at 70% -10%, color-mix(in srgb, var(--accent) 18%, transparent), transparent), var(--bg); }
.launch-inner { max-width: 960px; margin: 0 auto; padding: 40px 20px 60px; }
.launch h1 { font-size: 30px; margin: 0 0 4px; letter-spacing: -.5px; }
.launch .lead { color: var(--fg2); font-size: 15px; margin: 0 0 26px; max-width: 640px; }
.scn-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 14px; }
.scn { background: var(--panel); border: 1px solid var(--edge); border-radius: 12px; padding: 16px; cursor: pointer; transition: border-color .12s, transform .12s; display: flex; flex-direction: column; gap: 9px; }
.scn:hover { border-color: var(--accent); transform: translateY(-2px); }
.scn.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.scn .tier { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .5px; color: var(--accent); }
.scn h3 { margin: 0; font-size: 16px; }
.scn .tl { color: var(--fg2); font-size: 12.5px; line-height: 1.45; }
.scn .skills { display: flex; flex-wrap: wrap; gap: 5px; }
.optbar { display: flex; flex-wrap: wrap; gap: 20px; margin: 24px 0; padding: 18px; background: var(--panel); border: 1px solid var(--edge); border-radius: 12px; }
.optgrp { display: flex; flex-direction: column; gap: 7px; }
.optgrp .lbl { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .5px; color: var(--fg3); }
.seg { display: inline-flex; background: var(--bg3); border: 1px solid var(--edge2); border-radius: 8px; padding: 3px; gap: 2px; }
.seg button { background: transparent; border: none; color: var(--fg2); padding: 6px 13px; border-radius: 6px; font-size: 13px; font-weight: 600; }
.seg button.on { background: var(--accent); color: var(--accentFg); }
.resume-banner { background: color-mix(in srgb, var(--accent) 14%, transparent); border: 1px solid var(--accent); border-radius: 10px; padding: 14px 16px; margin-bottom: 22px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

/* ---------- scorecard ---------- */
.score-hero { display: flex; align-items: center; gap: 24px; flex-wrap: wrap; padding: 6px 0 18px; }
.gradecircle { width: 104px; height: 104px; border-radius: 50%; display: grid; place-items: center; font-size: 42px; font-weight: 900; border: 4px solid; flex: none; }
.catbar { margin-bottom: 11px; }
.catbar .top { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; margin-bottom: 3px; }
.catbar .track { height: 8px; background: var(--bg3); border-radius: 5px; overflow: hidden; }
.catbar .fill { height: 100%; border-radius: 5px; }
.finding { border-left: 3px solid var(--edge2); padding: 8px 12px; margin-bottom: 8px; background: var(--bg2); border-radius: 0 6px 6px 0; font-size: 12.5px; }
.finding.bad { border-left-color: var(--crit); }
.finding.warn { border-left-color: var(--med); }
.finding.good { border-left-color: var(--good); }
.statgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.stat { background: var(--bg2); border: 1px solid var(--edge); border-radius: 8px; padding: 10px 12px; }
.stat .n { font-size: 20px; font-weight: 800; font-family: var(--mono); }
.stat .l { font-size: 11px; color: var(--fg3); text-transform: uppercase; letter-spacing: .3px; }

/* ---------- reference / binder ---------- */
.ref { max-width: 820px; margin: 0 auto; padding: 22px; }
.ref h2 { font-size: 16px; border-bottom: 1px solid var(--edge); padding-bottom: 6px; margin-top: 26px; }
.ref ol, .ref ul { padding-left: 20px; line-height: 1.6; }
.ref .rb { background: var(--panel); border: 1px solid var(--edge); border-radius: 10px; padding: 14px 16px; margin-bottom: 12px; }
.toast { position: fixed; bottom: 36px; left: 50%; transform: translateX(-50%); background: var(--bg3); color: var(--fg); border: 1px solid var(--edge2); padding: 9px 16px; border-radius: 8px; box-shadow: var(--shadow); z-index: 80; font-size: 13px; }
.toast.good { border-color: var(--good); } .toast.bad { border-color: var(--bad); }

@media (max-width: 820px) {
  .split.detail { grid-template-columns: 1fr; }
  .detailpanel, .mailview { position: fixed; inset: 0; z-index: 40; }
  .nav button span.lbl { display: none; }
  .hide-sm { display: none !important; }
}

U.b64decode = function (s) {

U.sanitizeHtml = function (html) {
  const allowed = new Set(['P', 'BR', 'B', 'STRONG', 'I', 'EM', 'U', 'A', 'DIV', 'SPAN', 'TABLE', 'TBODY', 'TR', 'TD', 'TH', 'UL', 'OL', 'LI', 'H1', 'H2', 'H3', 'H4', 'HR', 'SMALL', 'CENTER', 'FONT']);
  const doc = new DOMParser().parseFromString('<div>' + html + '</div>', 'text/html');
  const root = doc.body.firstChild;
  const walk = node => {
    for (const child of Array.from(node.childNodes)) {
      if (child.nodeType === 1) {
        if (!allowed.has(child.tagName)) {
          if (['SCRIPT', 'STYLE', 'IFRAME', 'OBJECT', 'EMBED', 'IMG', 'LINK', 'META'].includes(child.tagName)) child.remove();
          else { walk(child); child.replaceWith(...Array.from(child.childNodes)); }
          continue;
        }
        for (const a of Array.from(child.attributes)) {
          const n = a.name.toLowerCase();
          if (child.tagName === 'A' && n === 'href') {
            child.setAttribute('data-href', a.value);
            child.removeAttribute('href');
          } else if (!['style', 'align', 'color', 'colspan', 'width'].includes(n) || /expression|url\(|javascript/i.test(a.value)) {
            child.removeAttribute(a.name);
          }

        if (child.tagName === 'A') { child.setAttribute('class', 'mail-link'); child.setAttribute('tabindex', '0'); }
        walk(child);
      } else if (child.nodeType !== 3) child.remove();
    }
  };
  walk(root);
  return root.innerHTML;
};

'use strict';
/* ==========================================================================
   Scenario expansion: turns a scenario definition + seed + shift length into
   a full dataset (events, alerts, emails, chat, intel, assets, questions).
   Deterministic for a given (scenario, seed, length) so shifts can resume.
   ========================================================================== */

const GEN = {};

GEN.NOISE_TARGET = { 20: 45, 45: 95, 90: 170 };
GEN.DEFAULT_START = '2026-10-26T11:00:00Z';

GEN.build = function (scenario, seed, lenMin) {
  const rng = new U.RNG(U.hashSeed(scenario.id + '|' + seed + '|' + lenMin));
  const start = Date.parse(scenario.shiftStart || GEN.DEFAULT_START);
  const lenSec = lenMin * 60;
  const org = Object.assign({ name: 'Example Org', domain: 'example.com', adDomain: 'corp.local', egressIp: '203.0.113.10', sensor: 'sensor-01' }, scenario.org || {});

  const D = {
    scenario, seed, lenMin, start, end: start + lenSec * 1000, org,
    events: [], alerts: [], emails: [], chat: [], questions: [], incidents: {},
    intel: { ip: {}, domain: {}, hash: {}, url: {} },
    hosts: [], servers: [], devices: [], users: {}, entities: {},
    binder: {}, tuning: [], calendar: [], case0: null
  };

  const usedIps = new Set();
  const usedNames = new Set();
  const uidMemo = {};
  let alertSeq = 1;

  // ---------------------------------------------------------------- context
  const G = {
    rng, scenario, org, lenSec, start, D,
    num(v) {
      if (Array.isArray(v) && v.length === 2 && typeof v[0] === 'number') return (v[1] - v[0] > 50) ? rng.int(v[0], v[1]) : +rng.float(v[0], v[1]).toFixed(3);
      return v;
    },
    timeBetween(fromSec, toSec) { return start + Math.round(rng.float(fromSec, toSec) * 1000); },
    server(role) { return D.servers.find(s => s.role === role); },
    servers() { return D.servers; },
    anyServer() { return rng.pick(D.servers); },
    anyHost() { return rng.pick(D.hosts); },
    hostIn(role) { const hs = D.hosts.filter(h => h.role === role); return hs.length ? rng.pick(hs) : null; },
    device() { return D.devices.length ? rng.pick(D.devices) : G.anyServer(); },
    intel(key, rec) {
      const bucket = U.isIP(key) ? 'ip' : U.isHash(key) ? 'hash' : /^https?:/.test(key) ? 'url' : 'domain';
      if (!D.intel[bucket][key]) D.intel[bucket][key] = rec;
      else Object.assign(D.intel[bucket][key], rec);
    },
    communityId(src, sport, dst, dport, proto) {
      const h1 = U.hashSeed([src, sport, dst, dport, proto].join('|')), h2 = U.hashSeed([dst, dport, src, sport].join('#'));
      const bytes = [];
      for (const h of [h1, h2, h1 ^ h2, (h1 * 31) >>> 0, (h2 * 17) >>> 0]) bytes.push(h & 255, (h >>> 8) & 255, (h >>> 16) & 255, (h >>> 24) & 255);
      return '1:' + btoa(String.fromCharCode(...bytes.slice(0, 20)));
    },
    push(ev) { D.events.push(ev); return ev; },
    base(ts, dataset, module) {
      return { '@timestamp': U.iso(ts), _ts: ts, 'event.dataset': dataset, 'event.module': module, 'observer.name': org.sensor };
    },

    conn(o) {
      const ev = G.base(o.ts, 'zeek.conn', 'zeek');
      const proto = o.transport || 'tcp';
      Object.assign(ev, {
        'log.id.uid': o.uid || U.uid(rng), 'source.ip': o.src, 'source.port': o.sport ?? U.ephemeral(rng), 'destination.ip': o.dst, 'destination.port': o.dport,
        'network.transport': proto, 'network.protocol': o.service || '', 'event.duration': +(+G.num(o.duration ?? 0)).toFixed(6),
        'client.bytes': G.num(o.ob ?? 0), 'server.bytes': G.num(o.rb ?? 0), 'connection.state': o.state || 'SF',
        'connection.history': o.history || (o.state === 'REJ' ? 'Sr' : o.state === 'S0' ? 'S' : 'ShADadFf'),
        'network.community_id': G.communityId(o.src, o.sport, o.dst, o.dport, proto)
      });
      if (o.payload) ev.__payload = o.payload;
      return G.push(ev);
    },
    dns(o) {
      const ev = G.base(o.ts, 'zeek.dns', 'zeek');
      const resolver = (G.server('dns') || G.server('dc') || { ip: '10.0.0.53' }).ip;
      const q = o.query;
      const parts = q.split('.');
      Object.assign(ev, {

    },
    signin(o) {
      const ev = G.base(o.ts, 'identity.signin', 'identity');
      Object.assign(ev, {
        'user.name': o.user, 'source.ip': o.ip, 'source.geo.country_name': o.country || 'United States', 'source.geo.city_name': o.city || '',
        'event.outcome': o.outcome || 'success', 'cloud.service.name': o.app || 'Office 365 Exchange Online', 'user_agent.original': o.ua || LIB.userAgents[0],
        'identity.mfa': o.mfa || 'satisfied', 'identity.risk_level': o.risk || 'none'
      });
      return G.push(ev);
    }
  };
  D.G = G;

  // ---------------------------------------------------------------- environment
  const roleDept = { finance: 'Finance', corp: 'Operations', dev: 'Engineering', it: 'IT Service Desk', marketing: 'Marketing', hr: 'Human Resources', clinical: 'Clinical', eng: 'Engineering', exec: 'Executive', legal: 'Legal', guest: 'Guest', sales: 'Sales', plant: 'Plant Operations', research: 'Research' };
  const makePerson = (dept, opts = {}) => {
    let first, last, user;
    for (let t = 0; t < 100; t++) {
      first = opts.first || rng.pick(LIB.firstNames); last = opts.last || rng.pick(LIB.lastNames);
      user = (first[0] + last).toLowerCase();
      if (!D.users[user]) break;
      if (opts.first) { user = user + rng.int(2, 9); break; }
    }
    const p = { user, first, last, name: first + ' ' + last, email: `${first.toLowerCase()}.${last.toLowerCase()}@${org.domain}`, dept, title: opts.title || null, vip: !!opts.vip, host: null };
    D.users[user] = p;
    return p;
  };

  for (const s of (scenario.servers || [])) {
    const srv = Object.assign({ crit: 'high', os: 'Windows Server 2022' }, s);
    D.servers.push(srv); usedIps.add(srv.ip); usedNames.add(srv.name);
  }
  const subnets = scenario.subnets || [{ cidr: '10.10.0.0/16', name: 'Corporate', role: 'corp', prefix: 'CORP-WS', w: 1 }];
  const pop = scenario.population || 48;
  const wsSubnets = subnets.filter(s => s.workstations !== false);
  const wsum = wsSubnets.reduce((a, s) => a + (s.w || 1), 0);
  for (const sn of wsSubnets) {
    const n = Math.max(2, Math.round(pop * (sn.w || 1) / wsum));
    for (let i = 0; i < n; i++) {
      let name;
      do { name = sn.prefix + '-' + rng.int(1000, 9999); } while (usedNames.has(name));
      usedNames.add(name);
      const ip = U.randIpInCidr(rng, sn.cidr, usedIps);
      const person = sn.role === 'guest' ? null : makePerson(roleDept[sn.role] || sn.name);
      const host = { name, ip, role: sn.role, subnet: sn.name, cidr: sn.cidr, dept: person ? person.dept : 'Guest', user: person ? person.user : '', owner: person ? person.name : 'Unknown guest device', os: sn.role === 'guest' ? 'Unknown' : (sn.os || 'Windows 11 Enterprise 23H2'), crit: sn.crit || 'medium' };
      if (person) person.host = name;
      D.hosts.push(host);
    }
  }
  for (const dv of (scenario.devices || [])) {
    for (let i = 0; i < (dv.count || 4); i++) {
      const ip = U.randIpInCidr(rng, dv.cidr, usedIps);
      D.devices.push({ name: dv.prefix + '-' + U.pad(i + 1, 2), ip, kind: dv.kind, role: 'device', crit: 'low', os: dv.os || 'Embedded', subnet: dv.subnetName || 'Devices' });
    }
  }

  // ---------------------------------------------------------------- entities
  const ctx = { org, start: U.fmtTs(start, false), $resolve: null };
  const malPools = ['45.137.', '91.215.', '185.225.', '193.142.', '194.87.', '141.98.', '5.252.', '89.144.', '37.120.', '146.70.', '79.141.', '172.86.'];
  const iterMemo = {};
  let curIter = null;
  ctx.$resolve = function (path) {
    const [head, ...rest] = path.split('.');
    if (head === 'uid' || head === 'port') {
      const key = head + ':' + rest.join('.') + (curIter !== null ? '#' + curIter : '');
      if (!uidMemo[key]) uidMemo[key] = head === 'uid' ? U.uid(rng) : U.ephemeral(rng);
      return uidMemo[key];
    }
    if (head === '$i') return curIter ?? 0;
    if (head === 'hex') return rng.hex(Number(rest[0]) || 8);
    if (head === 'b32chunk') {
      // exfil helper: deterministic base32 chunk per iteration
      const k = 'b32:' + rest.join('.') + '#' + (curIter ?? 0);
      if (!iterMemo[k]) iterMemo[k] = rng.b32(Number(rest[0]) || 40);

    }
    if (head === 'rand') { const a = Number(rest[0]), b = Number(rest[1]); return rng.int(a, b); }
    if (head === 'server') { const s = D.servers.find(x => x.role === rest[0] || x.key === rest[0]); return s ? s[rest[1] || 'ip'] : undefined; }
    return undefined;
  };
  const usedEntityHosts = new Set();
  const ents = scenario.entities || {};
  const resolveEntity = (key, spec) => {
    spec = U.tpl(spec, ctx);
    let e = {};
    switch (spec.kind) {
      case 'workstation': {
        const cands = D.hosts.filter(h => (!spec.role || h.role === spec.role) && !usedEntityHosts.has(h.name) && h.user);
        const h = rng.pick(cands.length ? cands : D.hosts);
        usedEntityHosts.add(h.name);
        const u = D.users[h.user] || {};
        e = { host: h.name, ip: h.ip, user: h.user, name: u.name, first: u.first, last: u.last, email: u.email, dept: h.dept, title: u.title };
        if (spec.title) { u.title = spec.title; e.title = spec.title; }
        if (spec.vip) { u.vip = true; h.crit = 'high'; }
        if (spec.crit) h.crit = spec.crit;
        break;
      }
      case 'user': {
        const p = makePerson(spec.dept || 'Operations', { title: spec.title, vip: spec.vip, first: spec.first, last: spec.last });
        e = { user: p.user, name: p.name, first: p.first, last: p.last, email: p.email, title: p.title, dept: p.dept };
        if (spec.withHost) {
          const role = spec.withHost;
          const sn = subnets.find(s => s.role === role) || wsSubnets[0];
          let name; do { name = (spec.hostPrefix || sn.prefix) + '-' + rng.int(1000, 9999); } while (usedNames.has(name));
          usedNames.add(name);
          const ip = U.randIpInCidr(rng, sn.cidr, usedIps);
          D.hosts.push({ name, ip, role: sn.role, subnet: sn.name, cidr: sn.cidr, dept: p.dept, user: p.user, owner: p.name, os: 'Windows 11 Enterprise 23H2', crit: spec.vip ? 'high' : 'medium' });
          p.host = name; e.host = name; e.ip = ip;
          usedEntityHosts.add(name);
        }
        break;
      }
      case 'server': {
        const s = D.servers.find(x => x.role === spec.role || x.key === spec.role);
        e = s ? { host: s.name, ip: s.ip, name: s.name } : {};
        break;
      }
      case 'extip': {
        let ip;
        if (spec.ip) ip = spec.ip;
        else if (spec.cidr) ip = U.randIpInCidr(rng, spec.cidr, usedIps);
        else { do { ip = rng.pick(malPools) + rng.int(2, 254) + '.' + rng.int(2, 254); } while (usedIps.has(ip)); usedIps.add(ip); }

        break;
      }
      case 'domain': {
        let name = spec.name;
        if (!name) {
          const words = spec.words || ['cdn', 'sync', 'update', 'cloud', 'secure', 'portal', 'static', 'service', 'edge', 'docs', 'files', 'share', 'api', 'login', 'verify'];
          const tlds = spec.tlds || ['.com', '.net', '.top', '.online', '.xyz', '.site'];

        if (spec.sub) name = spec.sub + '.' + name;
        e = { name, apex: name.split('.').slice(-2).join('.') };
        break;
      }
      case 'hash': {
        e = { sha256: spec.sha256 || rng.hex(64), md5: rng.hex(32), sha1: rng.hex(40), file: spec.file || 'file.bin', size: spec.size || rng.int(40000, 900000) };

    D.entities[key] = e;
    ctx[key] = e;
    // register intel
    if (spec.intel) {
      const rec = U.tpl(U.clone(spec.intel), ctx);
      if (rec.ageDays !== undefined) {
        rec.created = U.fmtTs(start - rec.ageDays * 86400000, false).slice(0, 10);
        rec.age = rec.ageDays < 60 ? rec.ageDays + ' days' : Math.round(rec.ageDays / 365) + ' years';
      }
      const k = e.ip || e.name || e.sha256;
      if (k) G.intel(k, rec);
      if (e.sha256 && e.file) D.intel.hash[e.sha256].file = D.intel.hash[e.sha256].file || e.file;
    }
  };
  for (const [k, spec] of Object.entries(ents)) resolveEntity(k, spec);
  // resolves: domain -> ip relationship for passive DNS
  for (const [k, spec] of Object.entries(ents)) {
    if (spec.kind === 'domain' && spec.resolves && D.entities[spec.resolves]) {
      const ip = D.entities[spec.resolves].ip;
      const dn = D.entities[k].name;
      D.entities[k].ip = ip;
      if (D.intel.domain[dn]) D.intel.domain[dn].pdns = U.uniq([...(D.intel.domain[dn].pdns || []), ip]);
      if (D.intel.ip[ip]) D.intel.ip[ip].pdns = U.uniq([...(D.intel.ip[ip].pdns || []), dn]);
    }
  }
  ctx.vendor = scenario.vendorUpdater || null;

  // ---------------------------------------------------------------- background
  GEN.background(G, D, scenario, rng);

  // ---------------------------------------------------------------- noise
  const target = Math.round((GEN.NOISE_TARGET[lenMin] || Math.round(lenMin * 2)) * (scenario.noiseScale ?? 1));
  const profiles = scenario.noise || [];
  const wtot = profiles.reduce((a, p) => a + (p.w || 1), 0) || 1;
  for (const p of profiles) {
    const prof = LIB.noise[p.profile];
    if (!prof) continue;
    const n = Math.max(1, Math.round(target * (p.w || 1) / wtot));
    prof.gen(G, n);
  }

  // ---------------------------------------------------------------- storyline
  const timeOf = (t) => {
    if (t === undefined || t === null) return start;
    if (typeof t === 'number') return start + t * 1000;
    if (t.frac !== undefined) return start + Math.round(lenSec * t.frac * 1000);
    if (t.rel !== undefined) return start + Math.round(t.rel * 1000);
    return start;
  };
  for (const item of (scenario.storyline || [])) {
    const rep = item.repeat || { count: 1, every: 0, jitter: 0 };
    const count = typeof rep.count === 'object' && rep.count.untilFrac !== undefined
      ? Math.max(1, Math.floor(((start + lenSec * 1000 * rep.count.untilFrac) - timeOf(item.t)) / (rep.every * 1000)))
      : rep.count;
    const t0 = timeOf(item.t);
    const emit = (raw, ts) => {
      const o = U.tpl(U.clone(raw), ctx);
      o.ts = ts;
      for (const nk of ['ob', 'rb', 'duration', 'rlen', 'qlen', 'size', 'bytes']) if (o[nk] !== undefined) o[nk] = G.num(o[nk]);
      if (raw.type === 'alert') {
        const al = G.alert(o);
        if (o.incident) al.truth.incident = o.incident;
      } else if (G[raw.type]) G[raw.type](o);
    };
    for (let i = 0; i < count; i++) {
      curIter = count > 1 ? i : null;
      const jitter = rep.jitter ? rng.float(-rep.jitter, rep.jitter) : 0;

      if (item.type === 'group') {
        for (const sub of item.items) emit(sub, ts + Math.round((sub.dt || 0) * 1000));
      } else emit(item, ts);
    }
    curIter = null;
  }

  // ---------------------------------------------------------------- email
  GEN.emails(G, D, scenario, ctx, timeOf);

  // ---------------------------------------------------------------- chat, questions, incidents, binder
  D.chat = (scenario.chat || []).map((c, i) => {
    const o = U.tpl(U.clone(c), ctx);
    o.id = o.id || 'chat' + i;
    o.ts = timeOf(c.t);
    return o;
  }).sort((a, b) => a.ts - b.ts);
  D.questions = (scenario.questions || []).map((q, i) => Object.assign({ id: 'q' + (i + 1), points: 1, type: 'text' }, U.tpl(U.clone(q), ctx)));
  for (const [k, inc] of Object.entries(scenario.incidents || {})) D.incidents[k] = U.tpl(U.clone(inc), ctx);
  D.binder = U.tpl(U.clone(scenario.binder || {}), ctx);
  D.briefing = U.tpl(scenario.briefing || '', ctx);
  D.tuning = U.tpl(U.clone(scenario.tuning || []), ctx);
  D.calendar = U.tpl(U.clone(scenario.calendar || []), ctx);
  if (scenario.startingCase) D.case0 = U.tpl(U.clone(scenario.startingCase), ctx);

  // ---------------------------------------------------------------- finalize
  D.events.sort((a, b) => a._ts - b._ts);
  D.alerts.sort((a, b) => a.ts - b.ts);
  D.alertById = {};
  for (const a of D.alerts) D.alertById[a.id] = a;
  // a stable index for quick uid lookups (pcap / pivots)
  D.byUid = {};
  for (const ev of D.events) {
    const u = ev['log.id.uid'];
    if (u) (D.byUid[u] = D.byUid[u] || []).push(ev);
  }
  // asset lookup
  D.assetByIp = {};
  for (const h of [...D.hosts, ...D.servers, ...D.devices]) D.assetByIp[h.ip] = h;
  D.userByName = D.users;
  delete D.G;
  return D;
};

/* --------------------------------------------------------------------------
   Background population traffic: the "normal" that makes anomalies findable.
   -------------------------------------------------------------------------- */
GEN.background = function (G, D, scenario, rng) {
  const ds = new Set(scenario.datasets || ['zeek', 'proxy', 'email']);
  const from = -24 * 3600, to = G.lenSec;
  const perHost = scenario.sessionsPerHost || [18, 34];
  const dc = G.server('dc') || G.server('dns');
  const proxyOn = ds.has('proxy');
  for (const h of D.hosts) {
    const n = rng.int(perHost[0], perHost[1]) * (h.role === 'guest' ? 0.5 : 1);
    for (let i = 0; i < n; i++) {
      // diurnal bias: favour working hours (11:00-23:00 UTC)
      let off;
      for (let k = 0; k < 3; k++) {
        off = rng.float(from, to);
        const hr = new Date(G.start + off * 1000).getUTCHours();
        if (hr >= 11 && hr <= 23) break;
      }
      const ts = G.start + Math.round(off * 1000);
      const dst = rng.weighted(LIB.benign);
      const ip = rng.pick(dst.ips);
      const uid = U.uid(rng), sport = U.ephemeral(rng);
      G.dns({ ts: ts - rng.int(5, 60), src: h.ip, query: dst.d, answers: [ip] });
      if (dst.port === 80) {
        G.conn({ ts, uid, src: h.ip, sport, dst: ip, dport: 80, service: 'http', duration: rng.float(0.05, 1.2), ob: rng.int(300, 700), rb: rng.int(500, 30000), state: 'SF' });
        G.http({ ts: ts + 20, uid, src: h.ip, sport, dst: ip, dport: 80, method: 'GET', host: dst.d, uri: dst.http.uri, ua: dst.http.ua, status: 200, rlen: rng.int(400, 20000), mime: dst.http.mime });

      }
      G.intel(dst.d, { rep: 'benign', det: 0, cat: dst.cat, asn: dst.asn, age: '10+ years' });
      G.intel(ip, { rep: 'benign', det: 0, cat: dst.cat, asn: dst.asn, pdns: [dst.d] });
    }
    // internal AD chatter
    if (dc && h.role !== 'guest') {
      const m = rng.int(3, 7);

        const ts = G.start + Math.round(rng.float(from, to) * 1000);

      }
    }
    // file server use
    const fsrv = D.servers.filter(s => s.role === 'fileserver');
    if (fsrv.length && h.role !== 'guest' && rng.chance(0.7)) {
      const m = rng.int(1, 4);
      for (let i = 0; i < m; i++) {
        const ts = G.start + Math.round(rng.float(from, to) * 1000);
        G.conn({ ts, src: h.ip, dst: rng.pick(fsrv).ip, dport: 445, service: 'smb', duration: rng.float(1, 300), ob: rng.int(2000, 400000), rb: rng.int(2000, 3000000), state: 'SF' });
      }
    }

    if (ds.has('windows') && h.user) {
      const logon = G.start + Math.round(rng.float(-14 * 3600, -1 * 3600) * 1000);
      G.win({ ts: logon, host: h.name, code: 4624, user: h.user, logonType: 2, srcIp: '-' });
      const m = rng.int(3, 8);
      for (let i = 0; i < m; i++) {
        const pr = rng.pick(LIB.winProcs);
        G.win({ ts: logon + rng.int(10, 30000) * 1000, host: h.name, code: 4688, user: pr.parent === 'services.exe' || pr.parent === 'svchost.exe' ? 'SYSTEM' : h.user, proc: pr.p, parent: pr.parent, cmd: pr.cmd.replace('{{user}}', h.user) });
      }
      const fs1 = D.servers.find(s => s.role === 'fileserver');
      if (fs1 && rng.chance(0.6)) G.win({ ts: logon + rng.int(60, 9000) * 1000, host: fs1.name, code: 4624, user: h.user, logonType: 3, srcIp: h.ip });
      if (rng.chance(0.08)) G.win({ ts: logon - 30000, host: h.name, code: 4625, user: h.user, logonType: 2, srcIp: '-', extra: { 'winlog.event_data.FailureReason': 'Unknown user name or bad password.' } });
    }

    if (ds.has('identity') && h.user) {
      const m = rng.int(1, 3);
      for (let i = 0; i < m; i++) {
        const ts = G.start + Math.round(rng.float(from, to) * 1000);
        const home = rng.chance(0.25);
        G.signin({ ts, user: D.users[h.user].email, ip: home ? ('73.' + rng.int(10, 250) + '.' + rng.int(1, 250) + '.' + rng.int(2, 250)) : G.org.egressIp, city: home ? rng.pick(['Columbus', 'Dayton', 'Akron', 'Toledo', 'Canton']) : (G.org.city || 'Charlotte'), app: rng.pick(['Office 365 Exchange Online', 'Microsoft Teams', 'SharePoint Online']) });

  }
  // windows server noise (service accounts)
  if (ds.has('windows')) {
    for (const s of D.servers) {
      const m = rng.int(4, 10);
      for (let i = 0; i < m; i++) {
        const ts = G.start + Math.round(rng.float(from, to) * 1000);

  if (ds.has('email')) {
    const users = Object.values(D.users).filter(u => u.host);
    const n = Math.round(users.length * 2.2);
    for (let i = 0; i < n; i++) {
      const s = rng.pick(LIB.newsletterSenders);

    }
  }
};

   Reported emails + their gateway delivery logs
   -------------------------------------------------------------------------- */
GEN.emails = function (G, D, scenario, ctx, timeOf) {
  const rng = G.rng;
  const list = scenario.emails || [];
  for (let i = 0; i < list.length; i++) {
    const raw = list[i];
    const e = U.tpl(U.clone(raw), ctx);
    e.id = e.id || 'M' + (i + 1);
    e.deliveredTs = timeOf(raw.delivered || { rel: -1800 });
    e.reportTs = timeOf(raw.reported || raw.t || { frac: 0.05 });
    e.messageId = e.messageId || `<${rng.hex(8)}-${rng.hex(4)}-${rng.hex(4)}-${rng.hex(12)}@${(e.from.address || 'mail.example').split('@')[1]}>`;
    e.srcIp = e.srcIp || ('185.' + rng.int(10, 250) + '.' + rng.int(1, 250) + '.' + rng.int(2, 250));
    e.recipients = U.uniq([...(e.to || []), ...(e.alsoTo || [])]);
    e.auth = Object.assign({ spf: 'pass', dkim: 'pass', dmarc: 'pass' }, e.auth || {});
    // links extracted from body
    e.links = [];
    const re = /href="([^"]+)"/g; let m;
    while ((m = re.exec(e.body || ''))) e.links.push(m[1]);
    e.links = U.uniq(e.links);
    const fromDomain = (e.from.address || '').split('@')[1] || '';
    const rcvHost = e.mtaHost || ('mail.' + fromDomain);
    const date = new Date(e.deliveredTs - 4000).toUTCString().replace('GMT', '+0000');
    // build raw headers
    const hdr = [];
    hdr.push(['Received', `from ${G.org.mxHost || 'mx1.' + G.org.domain} (10.30.0.25) by ${G.org.mbxHost || 'EXCH-MBX02.' + G.org.adDomain} with Microsoft SMTP Server id 15.2.1544.11; ${date}`]);
    hdr.push(['Received', `from ${rcvHost} (${rcvHost} [${e.srcIp}]) by ${G.org.mxHost || 'mx1.' + G.org.domain} (Postfix) with ESMTPS id ${rng.hex(10).toUpperCase()} for <${e.recipients[0]}>; ${date}`]);
    if (e.extraReceived) for (const r of e.extraReceived) hdr.push(['Received', r]);
    hdr.push(['Authentication-Results', `${G.org.mxHost || 'mx1.' + G.org.domain}; spf=${e.auth.spf} (domain of ${(e.returnPath || e.from.address).split('@')[1]} ${e.auth.spf === 'pass' ? 'designates' : 'does not designate'} ${e.srcIp} as permitted sender) smtp.mailfrom=${e.returnPath || e.from.address}; dkim=${e.auth.dkim}${e.auth.dkim === 'pass' ? ' header.d=' + (e.dkimDomain || fromDomain) : ' (no signature)'}; dmarc=${e.auth.dmarc} (p=${e.dmarcPolicy || (e.auth.dmarc === 'pass' ? 'reject' : 'none')}) header.from=${fromDomain}`]);
    hdr.push(['Return-Path', `<${e.returnPath || e.from.address}>`]);
    hdr.push(['From', `"${e.from.name}" <${e.from.address}>`]);
    hdr.push(['To', e.recipients.length > 3 ? `undisclosed-recipients:;` : e.recipients.map(r => '<' + r + '>').join(', ')]);
    if (e.replyTo) hdr.push(['Reply-To', `<${e.replyTo}>`]);
    hdr.push(['Subject', e.subject]);
    hdr.push(['Date', date]);
    hdr.push(['Message-ID', e.messageId]);
    hdr.push(['MIME-Version', '1.0']);
    hdr.push(['Content-Type', (e.attachments && e.attachments.length) ? `multipart/mixed; boundary="----=_Part_${rng.int(10000, 99999)}"` : 'text/html; charset="utf-8"']);
    for (const h of (e.headers || [])) hdr.push(h);
    hdr.push(['X-MS-Exchange-Organization-SCL', String(e.scl ?? (e.auth.dmarc === 'pass' ? 1 : 5))]);
    e.rawHeaders = hdr;
    // gateway log for each recipient
    const urlDomain = e.links.length ? (() => { try { return new URL(e.links[0]).hostname; } catch (x) { return ''; } })() : '';
    for (const r of e.recipients) {
      G.gateway({ ts: e.deliveredTs + rng.int(0, 20000), from: e.from.address, returnPath: e.returnPath, to: r, subject: e.subject, messageId: e.messageId, srcIp: e.srcIp,
        spf: e.auth.spf, dkim: e.auth.dkim, dmarc: e.auth.dmarc, attName: (e.attachments || []).map(a => a.name).join(','), attHash: (e.attachments || []).map(a => a.sha256).join(','), urlDomain, action: e.gatewayAction || 'delivered' });
    }
    if (e.reported !== false && raw.reported !== false) {
      e.reporter = e.reporter || e.recipients[0];
      D.emails.push(e);
    }
    for (const a of (e.attachments || [])) if (a.sha256 && !D.intel.hash[a.sha256] && a.intel) G.intel(a.sha256, a.intel);
  }
  D.emails.sort((a, b) => a.reportTs - b.reportTs);
};

const Q = {};

Q.rawOf = function (ev) {
  if (ev.__raw) return ev.__raw;
  const ds = ev['event.dataset'];
  const ts = (ev._ts / 1000).toFixed(6);
  let r;
  const zeekBase = () => ({ ts: Number(ts), uid: ev['log.id.uid'], 'id.orig_h': ev['source.ip'], 'id.orig_p': ev['source.port'], 'id.resp_h': ev['destination.ip'], 'id.resp_p': ev['destination.port'] });
  switch (ds) {
    case 'zeek.conn':
      r = JSON.stringify(Object.assign(zeekBase(), { proto: ev['network.transport'], service: ev['network.protocol'] || undefined, duration: ev['event.duration'], orig_bytes: ev['client.bytes'], resp_bytes: ev['server.bytes'], conn_state: ev['connection.state'], local_orig: U.isInternal(ev['source.ip']), local_resp: U.isInternal(ev['destination.ip']), history: ev['connection.history'], community_id: ev['network.community_id'] }));
      break;
    case 'zeek.dns':
      r = JSON.stringify(Object.assign(zeekBase(), { proto: 'udp', trans_id: (U.hashSeed(ev['log.id.uid']) & 65535), query: ev['dns.query.name'], qclass_name: 'C_INTERNET', qtype_name: ev['dns.query.type_name'], rcode_name: ev['dns.response.code_name'], AA: false, RD: true, RA: true, answers: ev['dns.answers.name'] ? ev['dns.answers.name'].split(',') : undefined }));
      break;
    case 'zeek.http':
      r = JSON.stringify(Object.assign(zeekBase(), { trans_depth: 1, method: ev['http.method'], host: ev['http.virtual_host'], uri: ev['http.uri'], referrer: ev['http.referrer'], version: '1.1', user_agent: ev['http.useragent'], request_body_len: ev['http.request.body.length'], response_body_len: ev['http.response.body.length'], status_code: ev['http.status_code'], status_msg: { 200: 'OK', 404: 'Not Found', 403: 'Forbidden', 302: 'Found', 301: 'Moved Permanently', 500: 'Internal Server Error' }[ev['http.status_code']] || 'OK', resp_mime_types: ev['file.mime_type'] ? [ev['file.mime_type']] : undefined }));
      break;
    case 'zeek.ssl':
      r = JSON.stringify(Object.assign(zeekBase(), { version: ev['ssl.version'], cipher: 'TLS_AES_256_GCM_SHA384', server_name: ev['ssl.server_name'] || undefined, established: true, subject: ev['ssl.certificate.subject'], issuer: ev['ssl.certificate.issuer'], validation_status: ev['ssl.validation_status'], ja3: ev['hash.ja3'], ja3s: ev['hash.ja3s'] }));
      break;
    case 'zeek.files':
      r = JSON.stringify({ ts: Number(ts), fuid: ev['log.id.fuid'], uid: ev['log.id.uid'] || undefined, tx_hosts: [ev['source.ip']], rx_hosts: [ev['destination.ip']], source: ev['file.source'], depth: 0, analyzers: ['MD5', 'SHA1', 'SHA256'], mime_type: ev['file.mime_type'], filename: ev['file.name'] || undefined, total_bytes: ev['file.size'], md5: ev['hash.md5'], sha1: ev['hash.sha1'], sha256: ev['hash.sha256'] });
      break;
    case 'suricata.alert':
    case 'identity.alert':
      r = JSON.stringify({ timestamp: ev['@timestamp'].replace('Z', '+0000'), flow_id: U.hashSeed(ev['log.id.uid'] || '') * 1000 + 7, in_iface: 'bond0', event_type: 'alert', src_ip: ev['source.ip'], src_port: ev['source.port'], dest_ip: ev['destination.ip'], dest_port: ev['destination.port'], proto: (ev['network.transport'] || '').toUpperCase(), community_id: ev['network.community_id'], alert: { action: 'allowed', gid: 1, signature_id: Number(ev['rule.uuid']), rev: ev['rule.rev'], signature: ev['rule.name'], category: ev['rule.category'], severity: 5 - ev['event.severity'] } });
      break;
    case 'proxy.access': {
      const m = ev['http.request.method'];
      const code = (m === 'CONNECT' ? 'TCP_TUNNEL/' : (ev['event.action'] === 'blocked' ? 'TCP_DENIED/' : 'TCP_MISS/')) + ev['http.response.status_code'];
      const u = m === 'CONNECT' ? (ev['url.domain'] + ':443') : ev['url.original'];
      r = `${ts.slice(0, -3)} ${Math.round(80 + (U.hashSeed(ev['url.original']) % 900))} ${ev['source.ip']} ${code} ${ev['http.response.bytes']} ${m} ${u} ${ev['user.name'] || '-'} HIER_DIRECT/${ev['destination.ip'] || '-'} ${m === 'CONNECT' ? '-' : 'text/html'} "${ev['user_agent.original']}"`;
      break;
    }
    case 'email.gateway':
      r = JSON.stringify({ Received: ev['@timestamp'], MessageId: ev['email.message_id'], SenderAddress: ev['email.from.address'], ReturnPath: ev['email.sender.address'], RecipientAddress: ev['email.to.address'], Subject: ev['email.subject'], FromIP: ev['source.ip'], Status: ev['event.action'], SPF: ev['email.auth.spf'], DKIM: ev['email.auth.dkim'], DMARC: ev['email.auth.dmarc'], AttachmentNames: ev['email.attachments.file.name'] || null, AttachmentSHA256: ev['email.attachments.file.hash.sha256'] || null, UrlDomains: ev['email.url.domain'] || null });
      break;
    case 'windows.security': {
      const d = new Date(ev._ts);

        'LogName=Security', `EventCode=${ev['event.code']}`, 'EventType=0', `ComputerName=${ev['host.name']}`, 'SourceName=Microsoft Windows security auditing.', `Type=Information`, `RecordNumber=${(U.hashSeed(ev['@timestamp'] + ev['host.name']) % 9000000) + 1000000}`,
        `Keywords=${ev['event.outcome'] === 'failure' ? 'Audit Failure' : 'Audit Success'}`, `TaskCategory=${{ 4624: 'Logon', 4625: 'Logon', 4688: 'Process Creation', 4672: 'Special Logon', 4698: 'Other Object Access Events', 4769: 'Kerberos Service Ticket Operations', 4720: 'User Account Management' }[ev['event.code']] || 'Other'}`,
        `Message=${ev.message || ''}`, '', 'Subject:', `\tAccount Name:\t\t${ev['user.name'] || '-'}`
      ];
      if (ev['winlog.logon.type']) lines.push('', `Logon Type:\t\t\t${ev['winlog.logon.type']}`, '', 'Network Information:', `\tSource Network Address:\t${ev['source.ip'] || '-'}`);
      if (ev['process.name']) lines.push('', 'Process Information:', `\tNew Process Name:\t${ev['process.name']}`, `\tCreator Process Name:\t${ev['process.parent.name'] || '-'}`, `\tProcess Command Line:\t${ev['process.command_line'] || ''}`);
      if (ev['winlog.event_data.FailureReason']) lines.push('', `Failure Reason:\t\t${ev['winlog.event_data.FailureReason']}`);
      r = lines.join('\n');
      break;
    }
    case 'identity.signin':
      r = JSON.stringify({ createdDateTime: ev['@timestamp'], userPrincipalName: ev['user.name'], appDisplayName: ev['cloud.service.name'], ipAddress: ev['source.ip'], location: { city: ev['source.geo.city_name'], countryOrRegion: ev['source.geo.country_name'] }, status: { errorCode: ev['event.outcome'] === 'success' ? 0 : 50126 }, mfaDetail: ev['identity.mfa'], riskLevelDuringSignIn: ev['identity.risk_level'], userAgent: ev['user_agent.original'] });
      break;
    default:
      r = JSON.stringify(Object.fromEntries(Object.entries(ev).filter(([k]) => !Q.HIDDEN.has(k))));
  }
  ev.__raw = r;
  return r;
};

Q.splView = function (ev) {
  if (ev.__spl) return ev.__spl;
  const ds = ev['event.dataset'];
  const [index, sourcetype, source] = Q.SPL_INDEX[ds] || ['main', ds, ds];
  const o = { _time: ev._ts, index, sourcetype, source, host: ev['observer.name'] };
  if (ds === 'windows.security' || ds === 'identity.signin' || ds === 'email.gateway' || ds === 'proxy.access') o.host = ds === 'windows.security' ? ev['host.name'] : (ds === 'proxy.access' ? 'proxy01' : ds === 'email.gateway' ? 'mailgw01' : 'idp-connector');
  for (const [k, v] of Object.entries(ev)) {
    if (Q.HIDDEN.has(k) || Q.SPL_DROP.has(k) || k.startsWith('_')) continue;
    const nk = Q.SPL_FIELDS[k] || k.replace(/\./g, '_');
    o[nk] = v;
  }
  if (ds === 'suricata.alert' || ds === 'identity.alert') o.action = 'allowed';
  o._raw = Q.rawOf(ev);
  ev.__spl = o;
  return o;
};

Q.SO_TEXT = new Set(['message', 'process.command_line', 'http.uri', 'url.original', 'email.subject', 'ssl.certificate.issuer', 'ssl.certificate.subject', 'http.useragent', 'user_agent.original', 'rule.name']);

    if (!neg && word === 'NOT') { toks.push({ t: 'NOT' }); continue; }

Q.soTermMatcher = function (term) {

Q.runOnion = function (query, events) {

// expression language for eval / where

// search clause tokenizer
Q.splTokenize = function (s) {
  const toks = []; let i = 0;
  while (i < s.length) {
    const c = s[i];
    if (/\s/.test(c)) { i++; continue; }
    if (c === '(') { toks.push({ t: '(' }); i++; continue; }
    if (c === ')') { toks.push({ t: ')' }); i++; continue; }
    if (c === '"') {
      let v = ''; i++; while (i < s.length && s[i] !== '"') { if (s[i] === '\\') i++; v += s[i++]; } i++;

    }

    while (i < s.length && !/\s/.test(s[i]) && s[i] !== '(' && s[i] !== ')') {
      const m = s.slice(i).match(/^(!=|>=|<=|=|>|<)/);
      if (m && w) {
        const op = m[1]; i += op.length;
        let v = '';

        else while (i < s.length && !/\s/.test(s[i]) && s[i] !== ')') v += s[i++];

      }
      w += s[i++];
    }

    const up = w.toUpperCase();
    if (up === 'AND' || up === 'OR' || up === 'NOT') toks.push({ t: up });

Q.splTermMatcher = function (term) {

    const re = value.includes('*') ? Q.wildRe('*' + value + '*') : null;
    const lw = value.toLowerCase();
    return r => { const raw = String(r._raw ?? JSON.stringify(r)); return re ? re.test(raw) : raw.toLowerCase().includes(lw); };
  }

Q.STATS_FN = {

  dc: vals => new Set(vals.filter(v => v !== undefined && v !== null && v !== '')).size,
  distinct_count: vals => new Set(vals.filter(v => v !== undefined && v !== null && v !== '')).size,
  sum: vals => +vals.reduce((a, v) => a + (Q.isNum(v) ? Number(v) : 0), 0).toFixed(3),
  avg: vals => { const n = vals.filter(Q.isNum); return n.length ? +(n.reduce((a, v) => a + Number(v), 0) / n.length).toFixed(3) : null; },
  mean: vals => Q.STATS_FN.avg(vals),
  min: vals => { const n = vals.filter(v => v !== undefined && v !== ''); return n.length ? n.reduce((a, v) => Q.cmp(v, a) < 0 ? v : a) : null; },
  max: vals => { const n = vals.filter(v => v !== undefined && v !== ''); return n.length ? n.reduce((a, v) => Q.cmp(v, a) > 0 ? v : a) : null; },
  range: vals => { const n = vals.filter(Q.isNum).map(Number); return n.length ? Math.max(...n) - Math.min(...n) : null; },

Q.parseAggs = function (s) {

      aggs.push({ fn, field: f, as: m[3] || (f ? `${fn}(${f})` : fn) });

Q.aggregate = function (rows, aggs, by) {
  const groups = new Map();
  for (const r of rows) {
    const key = by.map(f => r[f] ?? '').join('\u0001');
    if (by.some(f => r[f] === undefined || r[f] === null || r[f] === '')) continue;
    if (!groups.has(key)) groups.set(key, { first: r, items: [] });
    groups.get(key).items.push(r);
  }
  if (!by.length && !groups.size) groups.set('', { first: {}, items: [] });

  for (const g of groups.values()) {
    const o = {};
    for (const f of by) o[f] = g.first[f];
    for (const a of aggs) o[a.as] = Q.STATS_FN[a.fn](a.field ? g.items.map(x => x[a.field]) : null, g.items);

Q.runSPL = function (query, events, range) {
